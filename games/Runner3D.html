 if(W.laser){const dps=base*5*W.laser,w=0.7+W.laser*0.15;
  for(const e of S.enemies)if(e.z<0&&e.z>-44&&Math.abs(e.x-px)<w+(e.mini?1:0.3)){hurtEnemy(e,dps*dt);if(Math.random()<0.25)sparkle(e.x,0.8,e.z,2,4);}
  for(const o of S.objs)if(o.z<0&&o.z>-44&&o.lane==lane&&(o.type=='gate'||Math.abs(o.x-px)<LW/2))hurtObj(o,dps*dt,dps*dt/base);
  if(S.boss&&Math.abs(px)<1.6+w)S.boss.hp-=dps*dt;}
 // flamethrower: short wide cone, burns groups
 if(W.flame){const dps=base*7*W.flame,reach=-(7+W.flame*1.2);
  for(const e of S.enemies)if(e.z<0&&e.z>reach&&Math.abs(e.x-px)<2.2+(-e.z)*0.12)hurtEnemy(e,dps*dt);
  for(const o of S.objs)if(o.z<0&&o.z>reach-0.8&&o.lane==lane)hurtObj(o,dps*dt,dps*dt/base);
  if(S.boss&&S.boss.z>reach-1.5&&Math.abs(px)<4)S.boss.hp-=dps*dt;
  if(Math.random()<0.6)S.parts.push({x:px+(Math.random()-.5)*1.5,y:0.7,z:-1-Math.random()*2,vx:(Math.random()-.5)*3,vy:1+Math.random()*2,vz:-8-Math.random()*6,t:.35});}
 // homing missiles: pick the nearest threat anywhere on the road and splash it
 if(W.missile){S.mslT=(S.mslT||0)-dt;if(S.mslT<=0){S.mslT=Math.max(0.35,1.3-W.missile*0.15);
   for(let k=0;k<Math.min(5,W.missile);k++)S.missiles.push({x:px+(k-(W.missile-1)/2)*0.5,y:1.2,z:-0.5,vx:(Math.random()-.5)*6,vy:4,vz:-14,t:4});}}
 const targets=()=>{const c=S.enemies.filter(e=>!e.dead&&e.z<0).map(e=>({x:e.x,z:e.z,e}));for(const o of S.objs)if(!o.dead&&o.type=='barrel'&&o.z<0)c.push({x:o.x,z:o.z+0.75,o});if(S.boss)c.push({x:0,z:S.boss.z+1,boss:1});return c;};
 let tl=null;
 for(const m of S.missiles){m.t-=dt;if(!m.tg||(m.tg.e&&m.tg.e.dead)||(m.tg.o&&m.tg.o.dead)){tl=tl||targets();let best=null,bd=1e9;for(const c of tl){const d=Math.hypot(c.x-m.x,c.z-m.z);if(d<bd){bd=d;best=c;}}m.tg=best;}
  const t=m.tg;if(t){const tx=t.e?t.e.x:t.o?t.o.x:t.x,tz=t.e?t.e.z:t.o?t.o.z+0.75:S.boss?S.boss.z+1:t.z,dx=tx-m.x,dz=tz-m.z,d=Math.hypot(dx,dz)||1;
   m.vx+=(dx/d*28-m.vx)*Math.min(1,dt*6);m.vz+=(dz/d*28-m.vz)*Math.min(1,dt*6);
   if(d<0.8){const dmg=base*16*Math.max(1,W.missile*0.6);for(const e of S.enemies)if(Math.hypot(e.x-tx,e.z-tz)<1.6)hurtEnemy(e,dmg);
    for(const o of S.objs)if(o.type=='barrel'&&Math.abs(o.x-tx)<LW/2&&Math.abs(o.z+0.75-tz)<1.6)hurtObj(o,dmg,0);if(t.boss&&S.boss)S.boss.hp-=dmg;
    burst(tx,tz,12,1);ring(tx,tz,3.5,0xff8020);m.t=0;}}
  m.vy-=6*dt;m.x+=m.vx*dt;m.z+=m.vz*dt;m.y=Math.max(0.6,m.y+m.vy*dt);if(Math.random()<.5&&S.parts.length<480)S.parts.push({x:m.x,y:m.y,z:m.z+0.3,vx:0,vy:0.5,vz:1,t:.2});}
 S.missiles=S.missiles.filter(m=>m.t>0);}
function weaponsRender(){const W=S.w||{},t=performance.now()/1000;
 laserMesh.visible=!!W.laser;if(W.laser){laserMesh.position.set(S.px,0.7,-22);const s=1+W.laser*0.25+Math.sin(t*40)*0.15;laserMesh.scale.set(s,s,1);laserMesh.material.opacity=.6+Math.sin(t*25)*.2;}
 flameMesh.visible=!!W.flame;if(W.flame){const L=1+W.flame*0.15;flameMesh.position.set(S.px,0.8,-1-4.5*L);flameMesh.scale.set(1+Math.sin(t*30)*0.08,L,1+Math.cos(t*27)*0.08);}
 const n=Math.min(80,S.missiles.length);for(let i=0;i<n;i++){const m=S.missiles[i];dummy.position.set(m.x,m.y,m.z);dummy.rotation.set(Math.PI/2,0,-Math.atan2(m.vx,-m.vz));dummy.updateMatrix();missileM.setMatrixAt(i,dummy.matrix);}
 dummy.rotation.set(0,0,0);missileM.count=n;missileM.instanceMatrix.needsUpdate=true;}

function update(dt){
 if(flashT>0){flashT-=dt;if(flashT<=0)document.getElementById('flash').style.opacity=0;}
 const mv=S.speed*dt*(S.boss?0.0:1);S.dist+=mv;
 if(keys['a']||keys['arrowleft'])S.tx-=9*dt;if(keys['d']||keys['arrowright'])S.tx+=9*dt;
 const lim=Math.max(0.3,ROAD-crowdR()*0.6-0.2);S.tx=Math.max(-lim,Math.min(lim,S.tx));S.px+=(S.tx-S.px)*Math.min(1,dt*12);
 const inStage=S.dist-S.stageStart;
 // spawning
 if(!S.boss&&inStage<S.stageLen){
  if(S.dist>S.nextGate){spawnWave();S.nextGate=S.dist+24+Math.random()*8;}
  if(S.dist>S.nextR){makeGate(2,SPAWN_Z,gateLevel());S.nextR=S.dist+6;} // endless conveyor of reinforcement gates
  if(S.dist>S.nextMini){spawnMini();S.nextMini=Infinity;S.nextGate=Math.max(S.nextGate,S.dist+45);}}
 if(!S.boss&&inStage>=S.stageLen+60&&!S.enemies.length){S.boss={z:-36,hp:(()=>{const v=Math.max(1,Math.min(S.count,25));return (80+S.stage*60+v*S.dmg*Math.max(1,S.count/25)/S.rate*9)*(1+0.3*(gateLevel()-1));})(),max:0,t:0};S.boss.max=S.boss.hp;boss.visible=true;bb.style.display='block';SFX.boss();
  S.gates.forEach(g=>scene.remove(g.mesh));S.gates=[];S.objs.forEach(removeObj);S.objs=[];S.bd=0;S.nextBR=0;S.nextBS=12;}
 // during the boss fight the conveyor keeps running: reinforcement gates on the right, a special item on the left
 if(S.boss){S.bd+=S.speed*dt;
  if(S.bd>S.nextBR){makeGate(2,SPAWN_Z,gateLevel());S.nextBR=S.bd+6;}
  if(S.bd>S.nextBS){makeBarrel(0,SPAWN_Z,Math.max(10,firepower()*2.4),SPECIALS[Math.floor(Math.random()*SPECIALS.length)]);S.nextBS=S.bd+30;}}
 // gates
 for(const g of S.gates){g.z+=mv;g.mesh.position.z=g.z;
  if(!g.done&&g.z>=0){g.done=1;applyOp(g.ops[S.px<0?0:1]);g.mesh.children.forEach((c,i)=>{if(i<2&&i!=(S.px<0?0:1))c.visible=false;});}
  if(g.z>12){scene.remove(g.mesh);g.dead=1;}}
 S.gates=S.gates.filter(g=>!g.dead);
 // shooting
 S.flashT=Math.max(0,(S.flashT||0)-dt);S.recoil=Math.max(0,(S.recoil||0)-dt*7);
 for(const p of S.parts){p.vy-=12*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt+mv;p.t-=dt;}S.parts=S.parts.filter(p=>p.t>0&&p.y>0);
 S.fireT-=dt;if(S.fireT<=0&&S.count>0){S.fireT=S.rate;SFX.shoot();aimList=buildAim();S.fired=[];S.flashT=0.07;S.recoil=1;const shots=Math.min(S.count,25),per=S.dmg*Math.max(1,S.count/25);
  for(let i=0;i<shots;i++){const fi=Math.floor(Math.random()*Math.min(S.count,VIS)),f=form[fi];S.fired.push(fi);if(S.bullets.length<MAXB){const b={x:S.px+f[0],z:f[1]-0.3,d:per,life:1.3,vx:0};S.bullets.push(b);}}}
 for(const b of S.bullets){b.pz=b.z;b.z-=40*dt;b.x+=(b.vx||0)*dt;b.life-=dt;if(b.life<=0)b.dead=1;}
 // enemies
 const R=crowdR()+0.3;updateObjs(S.boss?S.speed*dt:mv,R,dt);weaponsUpdate(dt,R);fxUpdate(dt);
 for(const e of S.enemies){e.z+=mv+(e.mini?1.25:PUSH)*dt;
  if(!e.mini&&Math.abs(e.z)<R&&Math.abs(e.x-S.px)<R){e.dead=1;S.count--;SFX.hurt();}
  // enemy slipped past the army → penalty
  if(!e.dead&&e.z>R+0.5){e.dead=1;const p=e.mini?40:3;S.base=Math.max(0,S.base-p);SFX.hurt();flash(e.mini?'중간보스 돌파! 기지 -'+p:'적 돌파! 기지 -'+p);}}
 for(const e of S.enemies)if(e.mini&&!e.dead&&Math.abs(e.z)<R+0.8&&Math.abs(e.x-S.px)<R+0.8){e.t=(e.t||0)-dt;if(e.t<=0){e.t=0.2;S.count-=1+Math.floor(S.count*0.04);SFX.hurt();}e.z-=mv+2.5*dt-0.5*dt;}
 for(const b of S.bullets){if(b.dead)continue;if(bulletHitsObj(b)){b.dead=1;continue;}
  for(const e of S.enemies){const hr=e.mini?1.4:0.45;if(!e.dead&&Math.abs(e.z-b.z)<hr+0.05&&Math.abs(e.x-b.x)<hr){e.hp-=b.d;b.dead=1;if(e.hp<=0){e.dead=1;SFX.kill();burst(e.x,e.z,e.mini?20:5);}else if(Math.random()<.3)burst(b.x,b.z,1);break;}}
  if(!b.dead&&S.boss&&Math.abs(b.z-S.boss.z)<1.2&&Math.abs(b.x)<1.6){S.boss.hp-=b.d;b.dead=1;SFX.bossHit();}}
 S.bullets=S.bullets.filter(b=>!b.dead);S.enemies=S.enemies.filter(e=>!e.dead);
 // boss
 if(S.boss){const B=S.boss;B.z=Math.min(-R-1.2,B.z+3*dt);boss.position.set(0,0,B.z);
  if(B.z>=-R-1.3){B.atk=(B.atk||0)+dt;if(B.atk>=1.2){B.atk=0.001;SFX.hurt();SFX.boss();S.count-=2+Math.floor(S.count*0.1);shake=0.9;burst(0,B.z+2.6,24,0.3);ring(0,B.z+2.6,9,0xff4020);boom(0,B.z+2,6);screenFlash("#ff5030");}}else B.atk=0;
  bb.firstChild.style.width=Math.max(0,B.hp/B.max*100)+'%';
  if(B.hp<=0){SFX.clear();S.boss=null;boss.visible=false;bb.style.display='none';S.stage++;S.stageStart=S.dist;S.nextGate=S.dist+10;S.nextEnemy=S.dist+40;S.nextMini=S.dist+S.stageLen*0.6;S.base=Math.min(100,S.base+30);flash("스테이지 클리어! 기지 +30");}}
 S.count=Math.min(S.count,99999);if(S.count<=0||S.base<=0){S.count=Math.max(0,S.count);end();}
}
function render(){
 if(S){const n=Math.min(S.count,VIS),t=performance.now()/120;
  for(let i=0;i<n;i++){const f=form[i],bob=Math.abs(Math.sin(t+i))*0.08;
   dummy.position.set(S.px+f[0],0.35+bob,f[1]);dummy.updateMatrix();soldierM.setMatrixAt(i,dummy.matrix);
   dummy.position.y=0.85+bob;dummy.updateMatrix();headM.setMatrixAt(i,dummy.matrix);
   dummy.position.y=0.9+bob;dummy.updateMatrix();helmM.setMatrixAt(i,dummy.matrix);
   dummy.position.set(S.px+f[0]+0.2,0.55+bob,f[1]-0.25+S.recoil*0.12);dummy.updateMatrix();gunM.setMatrixAt(i,dummy.matrix);}
  {let fc=0;if(S.flashT>0)for(const fi of S.fired){if(fi>=n)continue;const f=form[fi];dummy.position.set(S.px+f[0]+0.2,0.56,f[1]-0.55);dummy.scale.setScalar(0.6+Math.random()*0.8);dummy.updateMatrix();flashM.setMatrixAt(fc++,dummy.matrix);}dummy.scale.setScalar(1);flashM.count=fc;flashM.instanceMatrix.needsUpdate=true;
   const pc=S.parts.length;for(let i=0;i<pc;i++){const p=S.parts[i];dummy.position.set(p.x,p.y,p.z);dummy.rotation.set(p.t*9,p.t*7,0);dummy.updateMatrix();partM.setMatrixAt(i,dummy.matrix);}dummy.rotation.set(0,0,0);partM.count=pc;partM.instanceMatrix.needsUpdate=true;}
  soldierM.count=headM.count=helmM.count=gunM.count=n;[soldierM,headM,helmM,gunM].forEach(o=>o.instanceMatrix.needsUpdate=true);
  miniPool.forEach(o=>o.visible=false);
  for(const e of S.enemies)if(e.mini&&!e.dead){const o=e.mesh;o.visible=true;o.position.set(e.x,Math.abs(Math.sin(performance.now()/200))*0.15,e.z);
   o.userData.bar.scale.x=Math.max(0.01,e.hp/e.max);o.userData.bar.lookAt(cam.position);
   const hitting=e.z>-crowdR()-2.2;o.userData.club.rotation.x=hitting?Math.sin(performance.now()/90)*1.3:Math.sin(performance.now()/400)*0.2;}
  const grunts=S.enemies.filter(e=>!e.mini);
  const m=Math.min(grunts.length,MAXE),tt=performance.now()/1000,CR=crowdR()+1.2;
  for(let i=0;i<m;i++){const e=grunts[i],ph=tt*9+i*1.7,sw=Math.sin(ph),bob=Math.abs(sw)*0.06,x=e.x,z=e.z,near=z>-CR-1.5;
   dummy.rotation.set(0,0,0);dummy.scale.set(1,1.15,0.9);dummy.position.set(x,0.5+bob,z);dummy.updateMatrix();enemyM.setMatrixAt(i,dummy.matrix);
   dummy.scale.set(1,1,1);dummy.position.set(x,0.98+bob,z+0.02);dummy.updateMatrix();ehM.setMatrixAt(i,dummy.matrix);
   for(let k=0;k<2;k++){const d=k?1:-1;
    dummy.position.set(x+d*0.22,1.04+bob,z);dummy.rotation.set(0,0,-d*1.1);dummy.updateMatrix();eEarM.setMatrixAt(i*2+k,dummy.matrix);
    dummy.rotation.set(0,0,0);dummy.position.set(x+d*0.08,1.0+bob,z+0.2);dummy.updateMatrix();eEyeM.setMatrixAt(i*2+k,dummy.matrix);
    dummy.position.set(x+d*0.1,0.18,z);dummy.rotation.set(d*sw*0.7,0,0);dummy.updateMatrix();eLegM.setMatrixAt(i*2+k,dummy.matrix);}
   const swing=near?Math.sin(tt*14+i)*1.3:-0.5+sw*0.2; // raise and smash the club when close to the squad
   dummy.position.set(x+0.3,0.78+bob,z+0.05);dummy.rotation.set(swing,0,-0.3);dummy.updateMatrix();eClubM.setMatrixAt(i,dummy.matrix);}
  dummy.rotation.set(0,0,0);dummy.scale.set(1,1,1);
  enemyM.count=ehM.count=eClubM.count=m;eEarM.count=eEyeM.count=eLegM.count=m*2;[enemyM,ehM,eEarM,eEyeM,eLegM,eClubM].forEach(o=>o.instanceMatrix.needsUpdate=true);
  animateBoss();weaponsRender();fxRender();
  if(!camBase)camBase=cam.position.clone();shake=Math.max(0,shake-0.03);cam.position.set(camBase.x+(Math.random()-.5)*shake,camBase.y+(Math.random()-.5)*shake,camBase.z);
  const k=S.bullets.length;for(let i=0;i<k;i++){const b=S.bullets[i];dummy.position.set(b.x,0.6,b.z);dummy.rotation.set(Math.PI/2,0,0);dummy.updateMatrix();bulletM.setMatrixAt(i,dummy.matrix);}dummy.rotation.set(0,0,0);
  bulletM.count=k;bulletM.instanceMatrix.needsUpdate=true;

  const p=new THREE.Vector3(S.px,1.9,-crowdR()*0.45).project(cam);
  cntEl.style.left=(p.x+1)/2*innerWidth+'px';cntEl.style.top=(viewTop+(1-p.y)/2*viewH)+'px';cntEl.textContent=S.count;if(PORT&&!hud._fit){hud._fit=1;resize();}S.pulse=Math.max(0,(S.pulse||0)-0.08);cntEl.style.transform=`translate(-50%,-100%) scale(${1+S.pulse*0.2})`;cntEl.style.color=S.pulse>0.3?"#7fffa0":"#fff";
  const prog=S.boss?'BOSS!':Math.min(100,Math.floor((S.dist-S.stageStart)/(S.stageLen+60)*100))+'%';
  hud.textContent=`🏠 기지 ${S.base}  ·  스테이지 ${S.stage}  ·  진행 ${prog}  ·  공격력 ${S.dmg.toFixed(1)}  ·  공속 ${(1/S.rate).toFixed(1)}/s${S.w.laser?"  ·  🔴"+S.w.laser:""}${S.w.flame?"  ·  🔥"+S.w.flame:""}${S.w.missile?"  ·  🚀"+S.w.missile:""}`;}
 renderer.render(scene,cam);}

function goFS(){ // in the arcade the parent page owns fullscreen; standalone the game asks for it itself
 if(parent!==window){try{parent.postMessage({type:'arcade-fs'},'*')}catch(e){}return;}
 try{const de=document.documentElement;if(!(de.requestFullscreen||de.webkitRequestFullscreen)){flash('휴대폰을 가로로 돌려주세요');return;}const el=document.documentElement,fs=el.requestFullscreen||el.webkitRequestFullscreen;const p=fs&&fs.call(el);(p&&p.then?p:Promise.resolve()).then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock("landscape")).catch(()=>{});}catch(e){}}

document.addEventListener("fullscreenchange",()=>document.body.classList.toggle("fs",!!document.fullscreenElement));
// commands from the arcade gear menu
let menuPaused=false;addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="arcade-cmd")return;
 if(d.cmd=="mute")muted=!!d.on;if(d.cmd=="flash")flash(d.text);if(d.cmd=="fs")document.body.classList.toggle("fs",!!d.on);
 if(d.cmd=="pause"&&running){running=false;menuPaused=true;}
 if(d.cmd=="resume"&&menuPaused){menuPaused=false;running=true;last=performance.now();}});
