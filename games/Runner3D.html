<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>산수 군단 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#87b8e8;font-family:"Malgun Gothic",sans-serif;user-select:none}

</style></head><body>
<div id="hud"></div><div id="basebar"><div></div><b></b></div><div id="flash"></div>
<div id="msg"><h1>산수 군단 3D</h1>좌우로 움직이며 대포를 쏘세요<br>대포알이 <b>×2 · +5</b> 막을 통과하면 늘어나고, 병사로 변해 적 기지로 돌격합니다<br>빨간 막은 대포알을 줄이고, 통을 부수면 대포가 강해져요<br>드래그 · A/D · ←/→ 이동 · M 음소거<br><br><b>터치하여 시작</b></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- sound ----------
let AC=null,master=null,muted=false,bgmT=null;
function initAudio(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.35;master.connect(AC.destination);}
function tone(f,d,type='square',vol=0.2,slide=0,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d);}
function noise(d,vol=0.2,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay,b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=vol;s.connect(g);g.connect(master);s.start(t);}
const thr={};const once=(k,ms,fn)=>{const n=performance.now();if(n-(thr[k]||0)<ms)return;thr[k]=n;fn();};
const SFX={
 shoot:()=>once('s',70,()=>{tone(220,0.08,'triangle',0.08,-120);noise(0.04,0.05);}),
 mult:()=>once('m',60,()=>tone(880,0.06,'square',0.04,300)),
 kill:()=>once('k',45,()=>{noise(0.06,0.08);tone(200,0.06,'triangle',0.06,-100);}),
 hurt:()=>once('h',90,()=>tone(150,0.15,'sawtooth',0.12,-60)),
 power:()=>{tone(400,0.35,'sawtooth',0.12,800);tone(600,0.35,'square',0.06,900,0.05);},
 hitBase:()=>once('b',80,()=>tone(110,0.07,'square',0.07)),
 clear:()=>[523,659,784,659,784,1047].forEach((f,i)=>tone(f,0.18,'square',0.14,0,i*0.11)),
 over:()=>[392,330,262,196].forEach((f,i)=>tone(f,0.3,'triangle',0.18,0,i*0.22))};
function startBGM(){stopBGM();if(!AC)return;let step=0;const bass=[110,110,165,147,131,131,165,196],mel=[440,0,523,0,659,587,523,0,440,0,392,440,523,0,0,0];
 bgmT=setInterval(()=>{if(muted||!running)return;const b=bass[(step>>1)%8];if(step%2==0)tone(b,0.18,'triangle',0.12);const m=mel[step%16];if(m)tone(m,0.12,'square',0.035);if(step%4==2)noise(0.03,0.05);step++;},140);}
function stopBGM(){if(bgmT)clearInterval(bgmT);bgmT=null;}
addEventListener('keydown',e=>{if(e.key.toLowerCase()=='m')muted=!muted;});

// ---------- scene ----------
const ROAD=4.6,FIELD=-66,MAXS=500,MAXE=400,MAXB=700;
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xcfe4f2,60,130);
{const c=document.createElement('canvas');c.width=2;c.height=256;const x=c.getContext('2d');const gr=x.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#3d7fd6');gr.addColorStop(.6,'#9fd0f5');gr.addColorStop(1,'#fdf1d8');x.fillStyle=gr;x.fillRect(0,0,2,256);scene.background=new THREE.CanvasTexture(c);}
const cam=new THREE.PerspectiveCamera(52,1,0.1,250);
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;
 // portrait phones need the camera further back to see the whole lane
 const port=innerHeight>innerWidth;cam.position.set(0,port?24:15,port?14:11);cam.lookAt(0,0,port?-30:-26);cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
scene.add(new THREE.HemisphereLight(0xdff0ff,0x4a6b3a,0.75));
const sun=new THREE.DirectionalLight(0xfff1d6,1.1);sun.position.set(8,22,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-16,right:16,top:20,bottom:-60,far:80});scene.add(sun);
function texCanvas(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t;}
const roadTex=texCanvas(256,256,(x,w,h)=>{x.fillStyle='#c9b38a';x.fillRect(0,0,w,h);for(let i=0;i<2500;i++){x.fillStyle=['#bba27a','#d6c298','#b49a70'][i%3];x.fillRect(Math.random()*w,Math.random()*h,3,3);}});roadTex.repeat.set(2,14);
const road=new THREE.Mesh(new THREE.PlaneGeometry(ROAD*2+1,90),new THREE.MeshStandardMaterial({map:roadTex,roughness:1}));road.rotation.x=-Math.PI/2;road.position.z=-32;road.receiveShadow=true;scene.add(road);
const grassTex=texCanvas(256,256,(x,w,h)=>{x.fillStyle='#5a9e43';x.fillRect(0,0,w,h);for(let i=0;i<4000;i++){x.fillStyle=['#4f913a','#68b04f','#77bd5a'][i%3];x.fillRect(Math.random()*w,Math.random()*h,2,3);}});grassTex.repeat.set(30,30);
const grass=new THREE.Mesh(new THREE.PlaneGeometry(220,220),new THREE.MeshStandardMaterial({map:grassTex,roughness:1}));grass.rotation.x=-Math.PI/2;grass.position.set(0,-0.02,-40);grass.receiveShadow=true;scene.add(grass);
[-1,1].forEach(d=>{const w=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.6,90),new THREE.MeshStandardMaterial({color:0x9a9fad}));w.position.set(d*(ROAD+0.8),0.3,-32);w.castShadow=w.receiveShadow=true;scene.add(w);});
{const trunkM=new THREE.MeshStandardMaterial({color:0x7a5230}),leafM=[0x3f8f3a,0x4fa244,0x2f7a34].map(c=>new THREE.MeshStandardMaterial({color:c,flatShading:true}));
 for(let i=0;i<36;i++){const t=new THREE.Group(),s=0.8+Math.random()*0.8;const tr=new THREE.Mesh(new THREE.CylinderGeometry(.15,.22,1.2,6),trunkM);tr.position.y=.6;tr.castShadow=true;t.add(tr);
  const lf=new THREE.Mesh(Math.random()<.5?new THREE.ConeGeometry(1,2.4,7):new THREE.IcosahedronGeometry(1.1,0),leafM[i%3]);lf.position.y=2.1;lf.castShadow=true;t.add(lf);
  t.scale.setScalar(s);t.position.set((i%2?1:-1)*(ROAD+2.8+Math.random()*9),0,4-Math.random()*80);scene.add(t);}}
// enemy base (castle) at the far end
const baseG=new THREE.Group();{const stone=new THREE.MeshStandardMaterial({color:0x7a5a5a,roughness:.8}),dark=new THREE.MeshStandardMaterial({color:0x4a2a2a});
 const keep=new THREE.Mesh(new THREE.BoxGeometry(7,5,3),stone);keep.position.y=2.5;keep.castShadow=true;baseG.add(keep);
 [-1,1].forEach(d=>{const tw=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.4,7,10),stone);tw.position.set(d*4,3.5,0);tw.castShadow=true;baseG.add(tw);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(1.6,2,10),new THREE.MeshStandardMaterial({color:0xb02a20}));roof.position.set(d*4,8,0);baseG.add(roof);});
 const gate=new THREE.Mesh(new THREE.BoxGeometry(2,2.6,0.2),dark);gate.position.set(0,1.3,1.55);baseG.add(gate);
 const flag=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1),new THREE.MeshBasicMaterial({color:0xe0402f,side:2}));flag.position.set(0.8,6.6,0);baseG.add(flag);const pole=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,2.4),dark);pole.position.set(0,6.2,0);baseG.add(pole);
 baseG.position.z=FIELD-2;scene.add(baseG);}
// player cannon
const cannon=new THREE.Group();{const metal=new THREE.MeshStandardMaterial({color:0x2f3b52,metalness:.6,roughness:.35}),wood=new THREE.MeshStandardMaterial({color:0x8a5a2e});
 const cart=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.6,1.6),wood);cart.position.y=0.5;cart.castShadow=true;cannon.add(cart);
 [-1,1].forEach(d=>{const wh=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,0.25,16),new THREE.MeshStandardMaterial({color:0x4a3018}));wh.rotation.z=Math.PI/2;wh.position.set(d*0.9,0.55,0);wh.castShadow=true;cannon.add(wh);});
 const brl=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.42,1.9,16),metal);brl.rotation.x=Math.PI/2-0.25;brl.position.set(0,1.15,-0.5);brl.castShadow=true;cannon.add(brl);cannon.userData.brl=brl;
 const ring=new THREE.Mesh(new THREE.TorusGeometry(0.36,0.07,8,16),new THREE.MeshStandardMaterial({color:0xd4a62a,metalness:.7}));ring.position.set(0,1.38,-1.4);ring.rotation.x=-0.25;cannon.add(ring);}
scene.add(cannon);
const muzzle=new THREE.Mesh(new THREE.SphereGeometry(0.45,10,8),new THREE.MeshBasicMaterial({color:0xfff2a0,transparent:true,opacity:0}));scene.add(muzzle);
// instanced crowds
const dummy=new THREE.Object3D();
function inst(geo,mat,n,shadow=true){const m=new THREE.InstancedMesh(geo,mat,n);m.castShadow=shadow;m.count=0;m.frustumCulled=false;scene.add(m);return m;}
const std=c=>new THREE.MeshStandardMaterial({color:c,roughness:.55});
const ballM=inst(new THREE.SphereGeometry(0.22,10,8),new THREE.MeshStandardMaterial({color:0x222831,metalness:.5,roughness:.3}),MAXB);
const sBody=inst(new THREE.CylinderGeometry(0.17,0.22,0.7,10),std(0x2f7cf6),MAXS),sHead=inst(new THREE.SphereGeometry(0.17,10,8),std(0xffd9b0),MAXS),
      sHelm=inst(new THREE.SphereGeometry(0.19,10,6,0,Math.PI*2,0,Math.PI/2),std(0x1d4fb0),MAXS),sSword=inst(new THREE.BoxGeometry(0.06,0.06,0.5),std(0xdfe4ec),MAXS);
const eBody=inst(new THREE.CylinderGeometry(0.2,0.26,0.8,10),std(0xe0402f),MAXE),eHead=inst(new THREE.SphereGeometry(0.19,10,8),std(0x7a1a12),MAXE),
      eHorn=inst(new THREE.ConeGeometry(0.07,0.22,6),std(0xfff2d0),MAXE*2);
const partM=inst(new THREE.BoxGeometry(0.13,0.13,0.13),new THREE.MeshBasicMaterial({color:0xffb040}),500,false);
const puffM=inst(new THREE.SphereGeometry(0.3,8,6),new THREE.MeshBasicMaterial({color:0x9fd8ff,transparent:true,opacity:.6}),200,false);

// ---------- labels ----------
function label(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return {c,x:c.getContext('2d'),t:new THREE.CanvasTexture(c)};}
function gateText(o){return o.t=='x'?'×'+o.v:o.t=='+'?'+'+o.v:'-'+o.v;}
function paintGate(o){const {c,x,t}=o.L;x.clearRect(0,0,c.width,c.height);const good=o.t!='-';
 const gr=x.createLinearGradient(0,0,0,c.height);gr.addColorStop(0,good?'rgba(80,180,255,.85)':'rgba(255,90,80,.85)');gr.addColorStop(1,good?'rgba(30,110,230,.6)':'rgba(190,30,25,.6)');x.fillStyle=gr;x.fillRect(0,0,c.width,c.height);
 x.strokeStyle='#ffffffdd';x.lineWidth=10;x.strokeRect(5,5,c.width-10,c.height-10);
 x.fillStyle='#fff';x.font='900 92px sans-serif';x.textAlign='center';x.textBaseline='middle';x.shadowColor='#0008';x.shadowBlur=8;x.fillText(gateText(o),c.width/2,c.height/2+4);t.needsUpdate=true;}
function paintBarrel(o){const {c,x,t}=o.L;x.clearRect(0,0,c.width,c.height);
 x.fillStyle=o.rw.col;x.fillRect(8,6,240,58);x.fillStyle='#fff';x.font='bold 34px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(o.rw.txt,128,36);
 x.fillStyle='#000a';x.fillRect(20,76,216,32);x.fillStyle='#ff5040';x.fillRect(20,76,216*Math.max(0,o.hp/o.max),32);x.fillStyle='#fff';x.font='bold 26px sans-serif';x.fillText(Math.ceil(o.hp),128,93);t.needsUpdate=true;}

// ---------- state ----------
let S=null,running=false;const hud=document.getElementById('hud'),msg=document.getElementById('msg'),bb=document.getElementById('basebar');
const REWARDS=[{k:'rate',txt:'⚡ 연사+',col:'#e09b18'},{k:'multi',txt:'💥 2연발',col:'#7a3fd0'},{k:'tough',txt:'🛡 병사 강화',col:'#2a9df4'}];
function clearScene(){if(!S)return;S.gates.forEach(g=>scene.remove(g.mesh));S.barrels.forEach(b=>scene.remove(b.mesh));}
function reset(){clearScene();S={x:0,tx:0,hp:20,hpMax:20,stage:1,rate:0.42,multi:1,tough:1,fireT:0,recoil:0,balls:[],sold:[],enem:[],gates:[],barrels:[],parts:[],puffs:[],
 spawnT:2,baseHp:0,baseMax:0,dealt:0,barrelT:8,flashT:0,t:0};setupStage();}
function setupStage(){const st=S.stage;clearScene();S.gates=[];S.barrels=[];S.enem=[];S.sold=[];S.balls=[];
 S.baseMax=S.baseHp=200+st*220+st*st*40;
 // two rows of sliding gates; later stages get tougher red gates
 const row=(z,n,sp)=>{const w=(ROAD*2)/n;for(let i=0;i<n;i++){const r=Math.random();let o;
   if(r<0.28)o={t:'x',v:st>=3&&Math.random()<0.15?3:2};else if(r<0.62)o={t:'+',v:1+Math.floor(Math.random()*3)};else o={t:'-',v:3+Math.floor(Math.random()*(3+st*2))};
   o.w=w*0.86;o.x=-ROAD+w*(i+.5);o.z=z;o.vx=sp*(Math.random()<.5?-1:1);o.L=label(256,150);
   o.mesh=new THREE.Mesh(new THREE.PlaneGeometry(o.w,2.1),new THREE.MeshBasicMaterial({map:o.L.t,transparent:true,side:2,depthWrite:false}));o.mesh.position.set(o.x,1.2,z);
   const posts=new THREE.Group();[-1,1].forEach(d=>{const p=new THREE.Mesh(new THREE.BoxGeometry(0.12,2.4,0.12),new THREE.MeshStandardMaterial({color:0xffffff}));p.position.set(d*o.w/2,0,0);posts.add(p);});o.mesh.add(posts);
   paintGate(o);scene.add(o.mesh);S.gates.push(o);}};
 row(-12,2,1.2+st*0.25);row(-21,3,0.9+st*0.3);if(st>=3)row(-29,2,1.6+st*0.2);
 flash(st==1?'적 기지를 무너뜨려라!':`스테이지 ${st}`);}
function spawnBarrel(){const rw=REWARDS[Math.floor(Math.random()*REWARDS.length)];if(rw.k=='multi'&&S.multi>=4)return;
 const g=new THREE.Group(),hp=25+S.stage*20+S.multi*15;
 const body=new THREE.Mesh(new THREE.CylinderGeometry(0.75,0.75,1.5,16),new THREE.MeshStandardMaterial({color:0x8a5a2e,roughness:.7}));body.position.y=.75;body.castShadow=true;g.add(body);
 [0.25,1.25].forEach(y=>{const r=new THREE.Mesh(new THREE.TorusGeometry(0.76,0.06,6,20),new THREE.MeshStandardMaterial({color:0x333333}));r.rotation.x=Math.PI/2;r.position.y=y;g.add(r);});
 const L=label(256,120),sp=new THREE.Sprite(new THREE.SpriteMaterial({map:L.t,depthTest:false}));sp.scale.set(2.6,1.2,1);sp.position.y=2.5;g.add(sp);
 const o={x:(Math.random()*2-1)*(ROAD-1.2),z:-6.5,hp,max:hp,rw,L,mesh:g,shown:-1};g.position.set(o.x,0,o.z);paintBarrel(o);scene.add(g);S.barrels.push(o);}
let flashT=0;function flash(t){const el=document.getElementById('flash');el.textContent=t;el.style.opacity=1;flashT=1.3;}
function burst(x,y,z,n,col){for(let i=0;i<n;i++)if(S.parts.length<500)S.parts.push({x,y,z,vx:(Math.random()-.5)*5,vy:2+Math.random()*4,vz:(Math.random()-.5)*5,t:.5});}

// ---------- input ----------
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let drag=null;addEventListener('pointerdown',e=>{if(S)drag={x:e.clientX,p:S.tx};});addEventListener('pointerup',()=>drag=null);addEventListener('pointercancel',()=>drag=null);
addEventListener('pointermove',e=>{if(drag&&running)S.tx=drag.p+(e.clientX-drag.x)/Math.min(innerWidth,700)*ROAD*2.4;});
msg.onclick=()=>{initAudio();AC.resume();reset();running=true;msg.style.display='none';startBGM();};
function score(){return (S.stage-1)*1000+Math.floor(S.dealt);}
function end(){running=false;SFX.over();try{parent.postMessage({type:'arcade-score',game:'run',score:score(),detail:'스테이지 '+S.stage},'*')}catch(e){}
 msg.style.display='flex';msg.innerHTML=`<h1>게임 오버</h1>내 성벽이 무너졌습니다<br>스테이지 ${S.stage} · 점수 ${score().toLocaleString()}<br><br><b>터치하여 재시작</b>`;}

// ---------- update ----------
function update(dt){S.t+=dt;
 if(flashT>0){flashT-=dt;if(flashT<=0)document.getElementById('flash').style.opacity=0;}
 if(keys['a']||keys['arrowleft'])S.tx-=10*dt;if(keys['d']||keys['arrowright'])S.tx+=10*dt;
 S.tx=Math.max(-ROAD+0.9,Math.min(ROAD-0.9,S.tx));S.x+=(S.tx-S.x)*Math.min(1,dt*14);
 // cannon fires continuously
 S.fireT-=dt;S.recoil=Math.max(0,S.recoil-dt*6);
 if(S.fireT<=0){S.fireT=S.rate;S.recoil=1;SFX.shoot();for(let k=0;k<S.multi;k++){const off=(k-(S.multi-1)/2)*0.45;if(S.balls.length<MAXB)S.balls.push({x:S.x+off,z:-1.6,y:1.3,vy:3,seen:0});}}
 // gates slide side to side
 for(const g of S.gates){g.x+=g.vx*dt;const lim=ROAD-g.w/2;if(g.x>lim||g.x<-lim){g.vx*=-1;g.x=Math.max(-lim,Math.min(lim,g.x));}g.mesh.position.x=g.x;}
 // barrels roll in occasionally, block balls; break them for a cannon upgrade
 S.barrelT-=dt;if(S.barrelT<=0){S.barrelT=11+Math.random()*6;if(S.barrels.length<1)spawnBarrel();}
 // balls: fly forward, multiply through gates, become soldiers past the last gate
 const nb=[];const lastGateZ=Math.min(...S.gates.map(g=>g.z))-1.5;
 for(const b of S.balls){const pz=b.z;b.z-=26*dt;b.vy-=9*dt;b.y=Math.max(0.3,b.y+b.vy*dt);
  let dead=false;
  for(const br of S.barrels){if(pz>=br.z+0.75&&b.z<br.z+0.75&&Math.abs(b.x-br.x)<0.95){br.hp-=1;dead=true;if(br.hp<=0&&!br.dead){br.dead=1;gain(br.rw);burst(br.x,1,br.z,18);scene.remove(br.mesh);}break;}}
  if(dead)continue;
  for(let gi=0;gi<S.gates.length;gi++){const g=S.gates[gi];if(b.seen&(1<<gi))continue;
   if(pz>=g.z&&b.z<g.z&&Math.abs(b.x-g.x)<g.w/2){b.seen|=1<<gi;
    if(g.t=='-'){if(Math.random()<Math.min(0.9,g.v/12)){dead=true;S.puffs.push({x:b.x,y:1,z:g.z,t:.3,r:1});break;}}
    else{const extra=g.t=='x'?g.v-1:g.v;for(let k=0;k<extra&&S.balls.length+nb.length<MAXB;k++)nb.push({x:Math.max(-ROAD+.3,Math.min(ROAD-.3,b.x+(Math.random()-.5)*g.w*0.8)),z:g.z-0.2-Math.random()*0.6,y:b.y,vy:1+Math.random()*2,seen:b.seen});SFX.mult();}}}
  if(dead)continue;
  if(b.z<lastGateZ){if(S.sold.length<MAXS)S.sold.push({x:b.x,z:b.z,hp:S.tough,ph:Math.random()*6,atk:0});S.puffs.push({x:b.x,y:0.4,z:b.z,t:.25,r:.6});continue;}
  nb.push(b);}
 S.balls=nb;S.barrels=S.barrels.filter(b=>!b.dead);
 for(const br of S.barrels){paintBarrelMaybe(br);}
 // enemies stream out of the base in waves
 S.spawnT-=dt;if(S.spawnT<=0){const st=S.stage,n=5+st*5+Math.floor(Math.random()*(3+st*2));S.spawnT=Math.max(1.4,3.2-st*0.22);
  for(let i=0;i<n&&S.enem.length<MAXE;i++)S.enem.push({x:(Math.random()*2-1)*(ROAD-0.6),z:FIELD+1+Math.random()*2,hp:1+Math.floor((st-1)/2),ph:Math.random()*6,atk:0,big:0});
  if(st>=2&&Math.random()<0.35&&S.enem.length<MAXE)S.enem.push({x:(Math.random()*2-1)*(ROAD-1.5),z:FIELD+1,hp:25+st*20,max:25+st*20,ph:0,atk:0,big:1});}
 // soldiers march toward the base, enemies march toward the player; they fight on contact
 const SV=3.4,EV=2.2+S.stage*0.12;
 for(const s of S.sold){s.ph+=dt*10;s.atk=Math.max(0,s.atk-dt*5);let tgt=null,bd=1.6;
  for(const e of S.enem){const d=Math.abs(e.z-s.z)+Math.abs(e.x-s.x)*0.8;if(d<bd){bd=d;tgt=e;}}
  if(tgt){s.x+=(tgt.x-s.x)*Math.min(1,dt*3);s.z+=(tgt.z>s.z?1:-1)*Math.min(SV*dt,Math.abs(tgt.z-s.z));
   if(Math.abs(tgt.z-s.z)<(tgt.big?1.1:0.45)&&Math.abs(tgt.x-s.x)<(tgt.big?1.2:0.5)){s.atk=1;tgt.atk=1;const m=Math.min(s.hp,tgt.hp);s.hp-=m;tgt.hp-=m;if(tgt.hp<=0){SFX.kill();burst(tgt.x,.6,tgt.z,tgt.big?20:4);}}}
  else{s.z-=SV*dt;if(s.z<FIELD+2.5){s.hp=0;S.baseHp-=1;S.dealt+=1;SFX.hitBase();burst(s.x,1.5,FIELD+1.5,2);}}}
 for(const e of S.enem){e.ph+=dt*8;e.atk=Math.max(0,e.atk-dt*5);if(e.hp>0)e.z+=EV*(e.big?0.6:1)*dt;
  if(e.z>-0.8&&e.hp>0){S.hp-=e.big?5:1;e.hp=0;SFX.hurt();burst(e.x,.6,e.z,6);flash(e.big?'💥 거인 돌파!':'');}}
 S.sold=S.sold.filter(s=>s.hp>0);S.enem=S.enem.filter(e=>e.hp>0);
 for(const p of S.parts){p.vy-=12*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.t-=dt;}S.parts=S.parts.filter(p=>p.t>0&&p.y>0);
 for(const p of S.puffs){p.t-=dt;p.r+=dt*3;}S.puffs=S.puffs.filter(p=>p.t>0);
 // stage clear / game over
 if(S.baseHp<=0){S.stage++;SFX.clear();S.hp=Math.min(S.hpMax,S.hp+5);setupStage();flash(`🏰 기지 함락! 스테이지 ${S.stage}`);}
 if(S.hp<=0){S.hp=0;end();}}
function paintBarrelMaybe(br){const n=Math.ceil(br.hp);if(n!==br.shown){br.shown=n;paintBarrel(br);}}
function gain(rw){if(rw.k=='rate')S.rate=Math.max(0.1,S.rate*0.82);else if(rw.k=='multi')S.multi=Math.min(4,S.multi+1);else S.tough++;SFX.power();flash(rw.txt+' 획득!');}

// ---------- render ----------
function render(){
 if(S){cannon.position.x=S.x;cannon.userData.brl.position.z=-0.5+S.recoil*0.25;
  muzzle.position.set(S.x,1.45,-1.9);muzzle.material.opacity=S.recoil>0.7?(S.recoil-0.7)*3:0;muzzle.scale.setScalar(0.6+S.recoil);
  let n=Math.min(S.balls.length,MAXB);for(let i=0;i<n;i++){const b=S.balls[i];dummy.position.set(b.x,b.y,b.z);dummy.updateMatrix();ballM.setMatrixAt(i,dummy.matrix);}ballM.count=n;ballM.instanceMatrix.needsUpdate=true;
  n=Math.min(S.sold.length,MAXS);for(let i=0;i<n;i++){const s=S.sold[i],bob=Math.abs(Math.sin(s.ph))*0.1,lean=s.atk*0.35;
   dummy.position.set(s.x,0.35+bob,s.z);dummy.rotation.set(-lean,0,0);dummy.updateMatrix();sBody.setMatrixAt(i,dummy.matrix);dummy.rotation.set(0,0,0);
   dummy.position.set(s.x,0.85+bob,s.z-lean*0.3);dummy.updateMatrix();sHead.setMatrixAt(i,dummy.matrix);dummy.position.y=0.9+bob;dummy.updateMatrix();sHelm.setMatrixAt(i,dummy.matrix);
   dummy.position.set(s.x+0.22,0.6+bob+s.atk*0.2,s.z-0.25-s.atk*0.2);dummy.rotation.set(-0.6-s.atk*1.4,0,0);dummy.updateMatrix();sSword.setMatrixAt(i,dummy.matrix);dummy.rotation.set(0,0,0);}
  [sBody,sHead,sHelm,sSword].forEach(m=>{m.count=n;m.instanceMatrix.needsUpdate=true;});
  n=Math.min(S.enem.length,MAXE);let hc=0;for(let i=0;i<n;i++){const e=S.enem[i],sc=e.big?2.3:1,bob=Math.abs(Math.sin(e.ph))*0.1*sc,lean=e.atk*0.35;
   dummy.scale.setScalar(sc);dummy.position.set(e.x,0.4*sc+bob,e.z);dummy.rotation.set(lean,0,0);dummy.updateMatrix();eBody.setMatrixAt(i,dummy.matrix);dummy.rotation.set(0,0,0);
   dummy.position.set(e.x,0.95*sc+bob,e.z+lean*0.3);dummy.updateMatrix();eHead.setMatrixAt(i,dummy.matrix);
   [-1,1].forEach(d=>{dummy.position.set(e.x+d*0.12*sc,1.15*sc+bob,e.z);dummy.rotation.set(0,0,-d*0.4);dummy.updateMatrix();eHorn.setMatrixAt(hc++,dummy.matrix);dummy.rotation.set(0,0,0);});}
  dummy.scale.setScalar(1);eBody.count=eHead.count=n;eHorn.count=hc;[eBody,eHead,eHorn].forEach(m=>m.instanceMatrix.needsUpdate=true);
  n=Math.min(S.parts.length,500);for(let i=0;i<n;i++){const p=S.parts[i];dummy.position.set(p.x,p.y,p.z);dummy.rotation.set(p.t*9,p.t*7,0);dummy.updateMatrix();partM.setMatrixAt(i,dummy.matrix);}dummy.rotation.set(0,0,0);partM.count=n;partM.instanceMatrix.needsUpdate=true;
  n=Math.min(S.puffs.length,200);for(let i=0;i<n;i++){const p=S.puffs[i];dummy.position.set(p.x,p.y,p.z);dummy.scale.setScalar(p.r);dummy.updateMatrix();puffM.setMatrixAt(i,dummy.matrix);}dummy.scale.setScalar(1);puffM.count=n;puffM.instanceMatrix.needsUpdate=true;
  baseG.position.x=Math.sin(S.t*40)*(S.baseHp<S.baseMax*0.3?0.04:0);
  hud.innerHTML=`<span>스테이지 ${S.stage}</span><span>❤ ${S.hp}/${S.hpMax}</span><span>⚔ 병사 ${S.sold.length}</span><span>💣 ${S.multi}연발 · 연사 ${(1/S.rate).toFixed(1)}/s</span>`;
  bb.firstElementChild.style.width=Math.max(0,S.baseHp/S.baseMax*100)+'%';bb.lastElementChild.textContent=`적 기지 ${Math.max(0,Math.ceil(S.baseHp))} / ${S.baseMax}`;}
 renderer.render(scene,cam);}
let last=performance.now();
function tick(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(running)update(dt);render();requestAnimationFrame(tick);}
reset();requestAnimationFrame(tick);
</script></body></html>
