<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영주 디펜스</title>
<style>
body{margin:0;background:#15121c;color:#fff;font-family:"Malgun Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;padding:0 8px}
canvas{max-width:100%;margin-top:8px;border-radius:10px;box-shadow:0 8px 30px #000a;touch-action:none}
#ui{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0;width:100%;max-width:1000px}
#ui h4{grid-column:1/-1;margin:4px 0 0;font-size:13px;color:#c9b88a;letter-spacing:.1em}
button{background:linear-gradient(#4a3c2a,#33281b);color:#fbeed3;border:2px solid #8a6b3d;border-radius:8px;padding:8px 6px;font-size:13px;cursor:pointer;font-family:inherit;line-height:1.3}
button:hover:not(:disabled){border-color:#ffd27a;background:linear-gradient(#5b4a33,#3d3020)}
button:disabled{opacity:.4;cursor:default}button b{color:#ffd27a}
#info{font-size:12px;color:#998;margin-bottom:10px;text-align:center}
/* portrait phone: tall canvas fills the screen, compact 3x3 button pad underneath */
body.port canvas{width:100%;height:auto;max-height:calc(100vh - 150px);object-fit:contain;margin-top:4px}
body.port #ui{gap:4px;margin:4px 0}
body.port #ui h4,body.port #info{display:none}
body.port button{font-size:11px;padding:4px 2px;line-height:1.2;border-radius:6px}
body.port button .k{display:none}
@media (max-width:700px){#ui h4,#info{display:none}button{font-size:11px;padding:4px 2px}button .k{display:none}}
/* full-screen layout: canvas takes all remaining space; button pad on the right (landscape) or a slim bar at the bottom (portrait) */
html,body{height:100%;overflow:hidden}
body{display:flex!important;flex-direction:row!important;align-items:stretch!important;padding:0!important;gap:0}
#stage{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 8px);box-sizing:border-box}
body.port #stage{padding-top:calc(env(safe-area-inset-top,0px) + 44px)}
#stage canvas{margin:0!important;max-width:none!important;max-height:none!important;border-radius:6px}
#ui{display:grid!important;grid-template-columns:1fr!important;grid-auto-rows:min-content;align-content:center;width:132px!important;max-width:none!important;margin:0!important;padding:6px;gap:4px!important;box-sizing:border-box;overflow-y:auto;background:#1d1710}
#ui h4,#info{display:none!important}
#ui button{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:4px;text-align:left;font-size:12px!important;padding:5px 6px!important;line-height:1.1!important;border-radius:6px}
#ui button i{font-style:normal;font-size:15px;text-align:center}#ui button .k{display:none}
#ui button b{font-size:11px}
#ui .sep{height:1px;background:#8a6b3d66;margin:2px 0}
#ui button.drag{touch-action:none;cursor:grab;border-style:dashed}
body.port{flex-direction:column!important}
body.port #ui{width:100%!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));gap:3px!important}
body.port #ui .sep{display:none}
body.port #ui button{grid-template-columns:1fr;justify-items:center;text-align:center;gap:0;padding:3px 1px!important;font-size:10px!important}
body.port #ui button i{font-size:14px}body.port #ui button b{font-size:10px}
</style></head><body>
<div id="stage"><canvas id="c" width="1000" height="480"></canvas></div>
<div id="ui"></div>
<div id="info">1~3 소환 · Q W E R T Y 업그레이드 · 필드 클릭: 폭탄 투하 (💣는 웨이브 클리어·정예/보스 처치로 획득) · P 일시정지</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=cv.width,H=cv.height,TOP=170,BOT=450,CX=150;
let S;
// ---------- sound ----------
// ---------- sound: louder master bus, arrow whooshes, hits, horn, castle thuds and a medieval march loop ----------
let AC=null,master=null,bgmT=null;function au(){if(S&&!S.started&&!S.over)S.started=true;if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);}AC.resume();}
let muted=false;function tone(f,d,t='square',v=.08,sl=0,dl=0){if(!AC||muted)return;const n=AC.currentTime+dl,o=AC.createOscillator(),q=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),n+d);q.gain.setValueAtTime(v,n);q.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(q);q.connect(master);o.start(n);o.stop(n+d);}
function noise(d,v=.15,freq=2000,q=1,dl=0,sweep=0){if(!AC||muted)return;const n=AC.currentTime+dl,len=Math.max(1,Math.floor(AC.sampleRate*d)),b=AC.createBuffer(1,len,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=Math.random()*2-1;
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type='bandpass';f.frequency.setValueAtTime(freq,n);if(sweep)f.frequency.exponentialRampToValueAtTime(Math.max(80,freq+sweep),n+d);f.Q.value=q;
 g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(f);f.connect(g);g.connect(master);s.start(n);}
const thr={};const once=(k,ms,fn)=>{const n=performance.now();if(n-(thr[k]||0)<ms)return;thr[k]=n;fn();};
const SFX={
 bow:()=>once('bow',60,()=>{noise(.16,.18,2600,2,0,-1800);tone(420,.05,'triangle',.06,-200);}),   // twang + whoosh of the arrow
 hit:()=>once('hit',45,()=>{noise(.05,.16,900,1.5);tone(180,.05,'square',.05,-60);}),
 kill:()=>once('kill',50,()=>{noise(.09,.18,500,1);tone(260,.08,'triangle',.08,-160);}),
 castle:()=>once('castle',120,()=>{noise(.18,.28,180,0.8);tone(70,.18,'sine',.25,-20);}),
 sword:()=>once('sword',90,()=>{noise(.07,.12,4200,3,0,-2000);}),
 boom:()=>{noise(.7,.5,300,0.6,0,-220);tone(70,.6,'sawtooth',.35,-30);},
 coin:()=>tone(1300,.07,'triangle',.12),
 pick:()=>{tone(700,.08,'square',.1,500);tone(1050,.08,'square',.06,0,.06);},
 horn:()=>{[0,.18,.36].forEach((t,i)=>tone([220,277,330][i],.32,'sawtooth',.09,0,t));},
 win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.16,'square',.1,0,i*.09)),
 over:()=>[392,330,262,196].forEach((f,i)=>tone(f,.3,'triangle',.18,0,i*.2))};
function startBGM(){if(bgmT)return;let step=0;const bass=[110,110,147,147,131,131,98,110],mel=[440,0,494,523,494,440,392,0,440,0,523,587,523,494,440,0];
 bgmT=setInterval(()=>{if(muted||!S||!S.started||S.over||S.paused)return;const b=bass[(step>>1)%8];if(step%2==0)tone(b,.22,'triangle',.11);
  const m=mel[step%16];if(m)tone(m,.14,'square',.028);if(step%4==0)noise(.05,.06,150,1);if(step%4==2)noise(.03,.04,3000,2);step++;},170);}
// ---------- data ----------
const UNITS=[
 {key:'1',ic:'⚔️',name:'검사',cost:30,hp:60,dmg:8,range:24,spd:50,rate:.8,col:'#4f8fff',kind:'sword'},
 {key:'2',ic:'🗼',name:'타워',cost:90,hp:320,dmg:9,range:210,spd:0,rate:.85,col:'#8a8f9c',kind:'tower',ranged:1,fixed:1},
 {key:'3',ic:'🛡️',name:'기사',cost:110,hp:220,dmg:18,range:26,spd:36,rate:1.1,col:'#b07bff',kind:'knight'}];
const UPS=[
 {key:'q',ic:'👑',sh:'영주공격',name:'영주 공격력',lv:'dmg',max:99,cost:l=>45+l*35,apply:()=>S.lordDmg+=5},
 {key:'w',ic:'⚡',sh:'영주공속',name:'영주 공속',lv:'rate',max:15,cost:l=>60+l*45,apply:()=>S.lordRate*=.87},
 {key:'e',ic:'🏰',sh:'성벽',name:'성벽 강화',lv:'wall',max:99,cost:l=>50+l*40,apply:()=>{S.castleMax+=100;S.castle=Math.min(S.castleMax,S.castle+150)}},
 {key:'r',ic:'🎯',sh:'멀티샷',name:'영주 멀티샷',lv:'multi',max:4,cost:l=>[1200,2500,4500,8000][l],label:l=>l<4?(l+2)+'발 활':'5발 MAX',apply:()=>S.arrows++},
 {key:'t',ic:'🗡️',sh:'병사공격',name:'병사 공격력',lv:'uatk',max:99,cost:l=>70+l*55,apply:()=>{S.uAtk+=.2;S.units.forEach(u=>u.dmg=u.base.dmg*S.uAtk)}},
 {key:'y',ic:'❤️',sh:'병사체력',name:'병사 체력',lv:'uhp',max:99,cost:l=>70+l*55,apply:()=>{S.uHp+=.25;S.units.forEach(u=>{const r=u.hp/u.max;u.max=u.base.hp*S.uHp;u.hp=u.max*r;})}}];
function reset(go){S={started:!!go,gold:90,wave:1,castle:300,castleMax:300,lordDmg:10,lordRate:1,lordT:0,arrows:1,tArch:1,uAtk:1,uHp:1,income:2,incT:0,
 units:[],enemies:[],shots:[],fx:[],items:[],bombs:1,spawnLeft:0,spawnT:0,waveT:8,over:false,paused:false,kills:0,shake:0,t:0,
 lv:{dmg:0,rate:0,wall:0,multi:0,tarch:0,uatk:0,uhp:0},lordAim:0,waveBonus:0};S.spawnLeft=8+S.wave*4;S.eliteAt=Math.ceil(S.spawnLeft/2);}
function spawnEnemy(){const w=S.wave,boss=S.spawnLeft==1&&w%5==0,r=Math.random();
 let e={x:W+20,y:TOP+Math.random()*(BOT-TOP),hp:26+w*12+w*w*.6,spd:40+Math.random()*18,dmg:6+w*1.5,range:20,rate:1,t:0,kind:'grunt',r:13,gold:Math.round((4+(w>>1))*1.3),pend:0,walk:Math.random()*9};
 if(r<.25&&w>2){e.hp*=.6;e.spd*=1.8;e.kind='runner';e.r=11;}
 else if(r<.4&&w>3){e.hp*=2.5;e.spd*=.6;e.kind='brute';e.r=18;e.gold*=2;}
 // elite mid-boss: one per wave (from wave 2), drops a bomb when killed
 if(!boss&&w>=2&&S.spawnLeft==S.eliteAt){e.hp*=7;e.spd=26;e.r=22;e.kind='elite';e.dmg*=2.5;e.gold*=6;}
 if(boss){e.hp=(26+w*12+w*w*.6)*18;e.spd=22;e.r=32;e.kind='boss';e.dmg*=4;e.gold=80;}
 e.max=e.hp;S.enemies.push(e);}
const alive=e=>e.hp>0;
// nearest enemy that isn't already doomed by arrows in flight
function pickTarget(x,y,range){let b=null,d=1e9;for(const e of S.enemies){if(e.hp-e.pend<=0)continue;const dd=Math.hypot(e.x-x,e.y-y);if(dd<d&&dd<range){d=dd;b=e}}return b;}
function nearest(arr,x,y){let b=null,d=1e9;for(const o of arr){const dd=Math.hypot(o.x-x,o.y-y);if(dd<d){d=dd;b=o}}return [b,d];}
function hit(e,dmg){e.hp-=dmg;SFX.hit();e.hitT=.12;for(let i=0;i<3;i++)S.fx.push({x:e.x,y:e.y,vx:(Math.random()-.5)*140,vy:-40-Math.random()*90,t:.25,part:"#fff3a0"});S.fx.push({x:e.x+(Math.random()-.5)*10,y:e.y-e.r-6,t:.6,txt:Math.round(dmg)});if(e.hp<=0&&!e.dead)kill(e);}
function kill(e){e.dead=1;SFX.kill();S.gold+=e.gold;S.kills++;for(let i=0;i<8;i++)S.fx.push({x:e.x,y:e.y,vx:(Math.random()-.5)*160,vy:-Math.random()*160,t:.5,part:e.kind=='boss'?'#3a0d0d':'#7fbf4a'});
 if(e.kind=='elite'||e.kind=='boss')gainBomb(e.x,e.y-e.r,e.kind=='boss'?'보스 처치! 💣 +1':'정예 처치! 💣 +1');}
function gainBomb(x,y,txt){const full=S.bombs>=3;if(!full){S.bombs++;SFX.pick();}S.fx.push({x,y,t:1.2,txt:full?'💣 가득 참':txt,col:'#ffd27a'});}
function fireLord(){const [sx,sy]=lordPos();const t=pickTarget(sx,sy,900);if(!t)return false;
 const a=Math.atan2(t.y-sy,t.x-sx);S.lordAim=a;t.pend+=S.lordDmg;
 S.shots.push({x:sx,y:sy,tg:t,dmg:S.lordDmg,spd:700,a,lord:1});
 const n=S.arrows;for(let i=1;i<n;i++){const off=Math.ceil(i/2)*(i%2?1:-1)*.16;S.shots.push({x:sx,y:sy,a:a+off,dmg:S.lordDmg*.8,spd:700,free:1,life:1.4});}
 SFX.bow();return true;}
function update(dt){
 if(!S.started||S.over||S.paused)return;S.t+=dt;
 S.incT+=dt;if(S.incT>=1){S.incT=0;S.gold+=S.income;}
 if(S.spawnLeft>0){S.spawnT-=dt;if(S.spawnT<=0){spawnEnemy();S.spawnLeft--;S.spawnT=Math.max(.25,1.1-S.wave*.06);}}
 else if(!S.enemies.length){if(!S.waveBonus){S.waveBonus=1;const [bx,by]=PORT?unP(PW/2,PH/2-60):[W/2,TOP+60];gainBomb(bx,by,'웨이브 클리어! 💣 +1');}
  S.waveT-=dt;if(S.waveT<=0){S.waveBonus=0;S.wave++;SFX.horn();{const bonus=40+S.wave*12;S.gold+=bonus;const [bx,by]=PORT?unP(PW/2,PH/2-20):[W/2,TOP+100];S.fx.push({x:bx,y:by,t:1.4,txt:'💰 웨이브 보너스 +'+bonus+'G',col:'#ffd27a'});}S.waveT=8;S.spawnLeft=8+S.wave*4;S.eliteAt=Math.ceil(S.spawnLeft/2);}}
 S.lordT-=dt;if(S.lordT<=0&&fireLord())S.lordT=S.lordRate;
 // defensive AI: archers hold a line near the wall; melee only sally out to meet enemies inside the guard zone, then hurry home
 const ARCH_LINE=CX+70,MELEE_LINE=CX+230,ENGAGE=CX+260;
 for(const u of S.units){u.t-=dt;u.walk+=dt*8;u.atk=Math.max(0,u.atk-dt*4);
  if(u.fixed){ // arrows leave from the archers on top of the tower (screen-space offset, so it is right in portrait too)
   const [tsx,tsy]=P(u.x,u.y),[ox,oy]=unP(tsx,tsy-50);let first=null;
   if(u.t<=0)for(let k=0;k<(u.arch||1);k++){const tg=pickTarget(ox,oy,u.range)||first;if(!tg)break;first=first||tg;u.face=Math.sign(tg.x-u.x)||1;tg.pend+=u.dmg;const [ax,ay]=unP(tsx+(k-((u.arch||1)-1)/2)*9,tsy-50);S.shots.push({x:ax,y:ay,tg,dmg:u.dmg,spd:560,a:0});}
   if(first)u.t=u.rate;continue;}
  if(u.hx==null){u.hx=u.ranged?CX+30+Math.random()*35:CX+70+Math.random()*50;u.hy=u.y;}
  const near=S.enemies.filter(e=>e.x<(u.ranged?u.x+u.range:ENGAGE));const[e,d]=nearest(near,u.x,u.y);
  const step=(tx,ty,sp)=>{const dx=tx-u.x,dy=ty-u.y,L=Math.hypot(dx,dy);if(L<2)return;u.face=Math.sign(dx)||u.face;const m=Math.min(L,sp*dt);u.x+=dx/L*m;u.y+=dy/L*m;};
  if(e&&d<=u.range+e.r){u.face=Math.sign(e.x-u.x)||1;if(u.t<=0){u.t=u.rate;u.atk=1;if(u.ranged){const tg=pickTarget(u.x,u.y,u.range+40)||e;tg.pend+=u.dmg;S.shots.push({x:u.x,y:u.y-10,tg,dmg:u.dmg,spd:500,a:0});}else{hit(e,u.dmg);SFX.sword();}}}
  else if(e&&!u.ranged)step(Math.min(e.x,MELEE_LINE),e.y,u.spd*1.2);
  else if(e&&u.ranged)step(u.hx,e.y,u.spd*.6); // archers just shuffle sideways to line up
  else step(u.hx,u.hy,u.spd*2.2);
  u.x=Math.min(u.x,u.ranged?ARCH_LINE:MELEE_LINE);}
 for(const e of S.enemies){e.t-=dt;e.walk+=dt*e.spd/6;const[u,d]=nearest(S.units,e.x,e.y);e.atk=Math.max(0,(e.atk||0)-dt*4);
  if(u&&d<=e.range+e.r+8){if(e.t<=0){e.t=e.rate;e.atk=1;u.hp-=e.dmg;}}
  else if(e.x>CX+50+e.r){e.x-=e.spd*dt;if(u&&d<120)e.y+=Math.sign(u.y-e.y)*e.spd*dt*.5;}
  else if(e.t<=0){e.t=e.rate;e.atk=1;S.castle-=e.dmg;S.shake=4;SFX.castle();}}
 for(const s of S.shots){
  if(s.free){s.x+=Math.cos(s.a)*s.spd*dt;s.y+=Math.sin(s.a)*s.spd*dt;s.life-=dt;if(s.life<=0||s.x>W+20||s.y<0||s.y>H)s.dead=1;
   for(const e of S.enemies)if(!e.dead&&Math.hypot(e.x-s.x,e.y-s.y)<e.r+4){hit(e,s.dmg);s.dead=1;break;}continue;}
  if(s.tg.dead){ // target died before impact: re-aim at a fresh enemy
   s.tg.pend-=s.dmg;const nt=pickTarget(s.x,s.y,400);if(!nt){s.dead=1;continue;}s.tg=nt;nt.pend+=s.dmg;}
  const a=Math.atan2(s.tg.y-s.y,s.tg.x-s.x);s.a=a;s.x+=Math.cos(a)*s.spd*dt;s.y+=Math.sin(a)*s.spd*dt;
  if(Math.hypot(s.tg.x-s.x,s.tg.y-s.y)<s.tg.r+2){s.tg.pend-=s.dmg;hit(s.tg,s.dmg);s.dead=1;}}
 S.shots=S.shots.filter(s=>!s.dead);S.enemies=S.enemies.filter(e=>!e.dead);S.units=S.units.filter(u=>u.hp>0);
 for(const e of S.enemies)e.hitT=Math.max(0,(e.hitT||0)-dt);for(const it of S.items){it.t-=dt;it.bob+=dt*5;}S.items=S.items.filter(i=>i.t>0);
 for(const f of S.fx){f.t-=dt;if(f.part){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=400*dt;}}S.fx=S.fx.filter(f=>f.t>0);
 S.shake*=.85;if(S.castle<=0&&!S.over){S.castle=0;S.over=true;SFX.over();try{parent.postMessage({type:"arcade-score",game:"def",score:(S.wave-1)*100+S.kills,detail:"웨이브 "+S.wave+" · 처치 "+S.kills},"*")}catch(e){}}}
// ---------- drawing ----------
const E=(x,y,rx,ry,f)=>{g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fillStyle=f;g.fill();};
let ground=null;function makeGround(){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 const sky=x.createLinearGradient(0,0,0,TOP);sky.addColorStop(0,'#7cc4f0');sky.addColorStop(1,'#cfe9f5');x.fillStyle=sky;x.fillRect(0,0,W,TOP);
 x.fillStyle='#8fb6a0';for(let i=0;i<8;i++){x.beginPath();x.moveTo(i*160-40,TOP-10);x.lineTo(i*160+60,TOP-80-((i*37)%40));x.lineTo(i*160+170,TOP-10);x.fill();}
 x.fillStyle='#6d9d5a';for(let i=0;i<30;i++)E2(x,i*36,TOP-8,30,16,'#5f9150');
 const gr=x.createLinearGradient(0,TOP-15,0,H);gr.addColorStop(0,'#78b257');gr.addColorStop(1,'#4f8a3c');x.fillStyle=gr;x.fillRect(0,TOP-15,W,H);
 x.fillStyle='#c6a671';x.globalAlpha=.55;x.beginPath();x.moveTo(CX,TOP+20);x.bezierCurveTo(400,TOP+10,600,BOT-10,W,TOP+120);x.lineTo(W,BOT-40);x.bezierCurveTo(600,BOT+20,400,BOT,CX,BOT-20);x.fill();x.globalAlpha=1;
 for(let i=0;i<500;i++){x.fillStyle=Math.random()<.5?'#5d9a45':'#8cc469';x.fillRect(Math.random()*W,TOP+Math.random()*(H-TOP),2,4);}
 for(let i=0;i<14;i++){const fx=Math.random()*W,fy=TOP+Math.random()*(H-TOP);E2(x,fx,fy,3,3,['#fff','#ffe066','#ff9ac0'][i%3]);}
 ground=c;}
function E2(x,a,b,rx,ry,f){x.beginPath();x.ellipse(a,b,rx,ry,0,0,7);x.fillStyle=f;x.fill();}
function drawCastle(){const x0=10,w=CX-20,top=TOP-90;
 g.fillStyle='#00000033';g.fillRect(x0+8,BOT-10,w,16);

UPS.forEach(u=>{const b=document.createElement('button');b.onclick=()=>upgrade(u);ui.appendChild(b);btns.push(()=>{const l=S.lv[u.lv],mx=l>=u.max,c=mx?0:u.cost(l);
 b.innerHTML=`<i>${u.ic}</i><span>${u.label?u.label(l):u.sh+' '+l}</span><b>${mx?'MAX':c+'G'}</b>`;b.title=u.name+' ['+u.key.toUpperCase()+']';b.disabled=mx||S.gold<c||S.over;});});
function summon(t){au();if(t.fixed){S.fx.push({x:CX+120,y:TOP+40,t:1,txt:'🗼 타워는 버튼을 드래그해서 배치',col:'#ffd27a'});return;}if(S.over||S.gold<t.cost)return;S.gold-=t.cost;S.units.push({...t,base:t,dmg:t.dmg*S.uAtk,hp:t.hp*S.uHp,max:t.hp*S.uHp,x:CX+30,y:TOP+Math.random()*(BOT-TOP),t:0,walk:0,atk:0,face:1});SFX.coin();}
function upgrade(u){au();const l=S.lv[u.lv];if(l>=u.max)return;const c=u.cost(l);if(S.over||S.gold<c)return;S.gold-=c;S.lv[u.lv]++;u.apply();SFX.pick();}
// ---------- bomb: drag from the bomb button, preview the blast, release to drop ----------
// release on the button again or outside the screen cancels
const BLAST=()=>PORT?100:90;
// the bomb button lives inside the castle wall so it never covers the field
function bombBtn(){return PORT?{x:CW-44,y:CH-96,r:28}:{x:72,y:BOT-92,r:30};}
let drag=null;
function evPos(ev){const r=cv.getBoundingClientRect();return {x:(ev.clientX-r.left)*CW/r.width,y:(ev.clientY-r.top)*CH/r.height,out:ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom};}
const overBtn=p=>{const b=bombBtn();return Math.hypot(p.x-b.x,p.y-b.y)<b.r+6;};
// ---------- tower menu: tap a tower to repair it or hire another archer for that tower (up to 4) ----------
let selTower=null,tBtns=[];
const repairCost=u=>Math.ceil((1-u.hp/u.max)*u.cost*0.9);
const archCost=u=>[45,65,85][(u.arch||1)-1]; // always cheaper than a new tower (90G)
function towerTap(p){
 const hitB=tBtns.find(b=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h);
 if(selTower&&hitB){const u=selTower,say=(t,c)=>S.fx.push({x:u.x,y:u.y-70,t:.8,txt:t,col:c});
  if(hitB.k=='rep'){const c=repairCost(u);if(u.hp>=u.max)return true;if(S.gold<c){say('골드 부족','#ff8080');return true;}S.gold-=c;u.hp=u.max;SFX.pick();say('🔧 수리 완료','#7fe3ab');}
  else{if((u.arch||1)>=4)return true;const c=archCost(u);if(S.gold<c){say('골드 부족','#ff8080');return true;}S.gold-=c;u.arch=(u.arch||1)+1;SFX.pick();say('🏹 궁수 '+u.arch+'명','#ffd27a');}
  return true;}
 const t=S.units.filter(u=>u.fixed).find(u=>{const [sx,sy]=P(u.x,u.y);return Math.abs(p.x-sx)<24&&p.y<sy+10&&p.y>sy-66;});
 if(t){selTower=t===selTower?null:t;return true;}
 if(selTower){selTower=null;return true;}
 return false;}
function drawRepair(){tBtns=[];if(!selTower)return;if(!S.units.includes(selTower)){selTower=null;return;}
 const u=selTower,[x,y]=P(u.x,u.y),full=u.hp>=u.max,rc=repairCost(u),a=u.arch||1,ac=a<4?archCost(u):0;
 g.save();g.strokeStyle='#ffd27a';g.lineWidth=2;g.setLineDash([5,4]);g.beginPath();g.ellipse(x,y+3,26,8,0,0,7);g.stroke();g.setLineDash([]);
 const w=112,h=32,gap=6,tw=w*2+gap,bx=Math.max(4,Math.min(CW-tw-4,x-tw/2)),by=Math.max(70,y-116);
 const btn=(k,bx,txt,on)=>{g.fillStyle=on?'#2f6b3aee':'#3a3a3aee';g.beginPath();g.roundRect?g.roundRect(bx,by,w,h,9):g.rect(bx,by,w,h);g.fill();g.strokeStyle='#ffd27a';g.lineWidth=2;g.stroke();
  g.fillStyle='#fff';g.font='bold 13px "Malgun Gothic"';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,bx+w/2,by+h/2+1);tBtns.push({k,x:bx,y:by,w,h});};
 btn('rep',bx,full?'체력 가득':`🔧 수리 ${rc}G`,!full&&S.gold>=rc);
 btn('arch',bx+w+gap,a>=4?'🏹 궁수 4 MAX':`🏹 궁수+1 ${ac}G`,a<4&&S.gold>=ac);
 g.textBaseline='alphabetic';g.fillStyle='#0008';g.fillRect(bx,by+h+4,tw,5);g.fillStyle='#5be36b';g.fillRect(bx,by+h+4,tw*u.hp/u.max,5);
 g.restore();}

cv.addEventListener('pointerdown',ev=>{const wasStarted=S.started;au();
 if(S.over){reset(true);return;}if(!wasStarted||S.paused)return;
 const p=evPos(ev);
 if(towerTap(p))return;
 if(overBtn(p)){if(S.bombs<=0){const b=bombBtn();S.fx.push({...wrld(b.x,b.y-40),t:.8,txt:'폭탄 없음',col:'#ff8080'});return;}
  drag={x:p.x,y:p.y,out:false,cancel:true};try{cv.setPointerCapture(ev.pointerId)}catch(e){}ev.preventDefault();}});
cv.addEventListener('pointermove',ev=>{if(!drag)return;const p=evPos(ev);drag.x=p.x;drag.y=p.y;drag.out=p.out;drag.cancel=p.out||overBtn(p);});
function endDrag(ev,forceCancel){if(!drag)return;const d=drag;drag=null;try{cv.releasePointerCapture(ev.pointerId)}catch(e){}
 if(forceCancel||d.cancel||S.over||S.paused)return;
 S.bombs--;S.shake=10;SFX.boom();const R=BLAST(),w=wrld(d.x,d.y);S.fx.push({...w,r:PORT?R/1.1:R,t:.6});
 for(const e of [...S.enemies]){const [ex,ey]=P(e.x,e.y);if(Math.hypot(ex-d.x,ey-d.y)<R+e.r)hit(e,40+S.lordDmg*3);}}
cv.addEventListener('pointerup',ev=>endDrag(ev,false));
cv.addEventListener('pointercancel',ev=>endDrag(ev,true));
function wrld(sx,sy){const [x,y]=unP(sx,sy);return {x,y};}
function drawBombUI(){const b=bombBtn(),n=S.bombs,t=performance.now()/1000;
 // button
 g.save();g.globalAlpha=n?1:.45;
 g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fillStyle='#1a1208dd';g.fill();g.lineWidth=3;g.strokeStyle=drag?'#ff8a3f':'#ffd27a';g.stroke();
 if(n&&!drag){g.globalAlpha=.25+Math.sin(t*4)*.15;g.beginPath();g.arc(b.x,b.y,b.r+5,0,7);g.strokeStyle='#ffd27a';g.lineWidth=2;g.stroke();g.globalAlpha=1;}
 E(b.x-2,b.y+3,15,15,'#222');E(b.x-7,b.y-3,4,3,'#fff5');g.strokeStyle='#a87';g.lineWidth=3;g.beginPath();g.moveTo(b.x+6,b.y-9);g.quadraticCurveTo(b.x+10,b.y-18,b.x+16,b.y-17);g.stroke();
 if(n)E(b.x+16,b.y-17,3+Math.random()*2,3+Math.random()*2,'#ffcc33');
 // count badge
 g.globalAlpha=1;g.beginPath();g.arc(b.x+b.r*.72,b.y+b.r*.72,13,0,7);g.fillStyle=n?'#e0402f':'#555';g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();
 g.fillStyle='#fff';g.font='bold 15px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(n,b.x+b.r*.72,b.y+b.r*.72+1);g.textBaseline='alphabetic';
 g.font='bold 11px "Malgun Gothic"';g.fillStyle='#fbeed3';g.fillText(drag?'여기로 놓으면 취소':'드래그해서 투하',b.x,b.y-b.r-8);
 g.restore();
 if(!drag||drag.out)return;
 // blast preview
 const R=BLAST();g.save();
 if(drag.cancel){g.setLineDash([6,6]);g.strokeStyle='#ffffffaa';g.lineWidth=2;g.beginPath();g.arc(drag.x,drag.y,R,0,7);g.stroke();}
 else{g.beginPath();g.arc(drag.x,drag.y,R,0,7);g.fillStyle='#ff5a1a33';g.fill();g.setLineDash([10,6]);g.lineDashOffset=-t*30;g.strokeStyle='#ff7a2a';g.lineWidth=3;g.stroke();
  g.setLineDash([]);for(const e of S.enemies){const [ex,ey]=P(e.x,e.y);if(Math.hypot(ex-drag.x,ey-drag.y)<R+e.r){g.beginPath();g.arc(ex,ey,e.r+5,0,7);g.strokeStyle='#ff3030';g.lineWidth=2.5;g.stroke();}}}
 g.setLineDash([]);E(drag.x,drag.y,13,13,'#222');g.strokeStyle='#fff';g.lineWidth=1.5;g.beginPath();g.moveTo(drag.x-R*.15,drag.y);g.lineTo(drag.x+R*.15,drag.y);g.moveTo(drag.x,drag.y-R*.15);g.lineTo(drag.x,drag.y+R*.15);g.stroke();
 g.restore();}
addEventListener('keydown',e=>{au();const k=e.key.toLowerCase();const u=UNITS.find(u=>u.key==k);if(u)summon(u);const p=UPS.find(p=>p.key==k);if(p)upgrade(p);if(k=='p')S.paused=!S.paused;});
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();btns.forEach(f=>f());requestAnimationFrame(loop);}
function fit(){const st=document.getElementById("stage"),aw=st.clientWidth-4,ah=st.clientHeight-4,k=Math.min(aw/CW,ah/CH);cv.style.width=CW*k+"px";cv.style.height=CH*k+"px";}
// commands from the arcade gear menu
let menuPaused=false;addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="arcade-cmd")return;
 if(d.cmd=="mute")muted=!!d.on;
 if(d.cmd=="pause"&&!S.paused&&!S.over){S.paused=true;menuPaused=true;}
 if(d.cmd=="resume"&&menuPaused){menuPaused=false;S.paused=false;}});
reset();setMode();fit();addEventListener("resize",()=>{setMode();fit();});requestAnimationFrame(loop);
