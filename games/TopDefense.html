<div id="stage"><canvas id="c" width="1000" height="480"></canvas></div>
<div id="ui"></div>
<div id="info">1~3 소환 · Q W E R T Y 업그레이드 · 필살 화살 버튼을 드래그해서 조준 (웨이브마다 1발) · P 일시정지</div>
<script>
const cv=document.getElementById('c');let g=cv.getContext('2d');
const W=cv.width,H=cv.height,TOP=170,BOT=450,CX=150;
let S;
// ---------- sound ----------
// ---------- sound: louder master bus, arrow whooshes, hits, horn, castle thuds and a medieval march loop ----------
let AC=null,master=null,bgmT=null;function au(){if(S&&!S.started&&!S.over)S.started=true;if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);}AC.resume();}
let muted=false;function tone(f,d,t='square',v=.08,sl=0,dl=0){if(!AC||muted)return;const n=AC.currentTime+dl,o=AC.createOscillator(),q=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),n+d);q.gain.setValueAtTime(v,n);q.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(q);q.connect(OUTN||master);o.start(n);o.stop(n+d);}
// one shared noise buffer (making a new one per sound was slow enough to push sounds out of sync)
let NB=null;function noise(d,v=.15,freq=2000,q=1,dl=0,sweep=0){if(!AC||muted)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
 const n=AC.currentTime+dl,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type='bandpass';f.frequency.setValueAtTime(freq,n);if(sweep)f.frequency.exponentialRampToValueAtTime(Math.max(80,freq+sweep),n+d);f.Q.value=q;
 g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(f);f.connect(g);g.connect(OUTN||master);s.start(n,Math.random()*0.5,d+0.02);}
// noise that fades IN (instead of starting at full volume) so it has no click at the start, then trails off
function whoosh(d,v,f0,f1){if(!AC||muted)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}const n=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),q=AC.createGain();s.buffer=NB;f.type='bandpass';f.Q.value=0.9;f.frequency.setValueAtTime(f0,n);f.frequency.exponentialRampToValueAtTime(f1,n+d);
 q.gain.setValueAtTime(0.0001,n);q.gain.exponentialRampToValueAtTime(v,n+d*0.3);q.gain.exponentialRampToValueAtTime(0.0001,n+d);s.connect(f);f.connect(q);q.connect(master);s.start(n,Math.random()*0.5,d+0.02);}
// long reverb bus for the ultimate: a generated 6s decaying-noise impulse response; withRev() routes the sounds made inside it through the bus
// Karplus-Strong plucked string: a noise burst circulating in a delay line with a soft lowpass; sounds like a real string being plucked
function ksPluck(f,v,dur,bright,damp0){if(!AC||muted)return;const sr=AC.sampleRate,len=Math.floor(sr*dur),buf=AC.createBuffer(1,len,sr),y=buf.getChannelData(0),N=Math.max(2,Math.round(sr/f));
 for(let i=0;i<N;i++)y[i]=(Math.random()*2-1)*(1-(1-bright)*Math.random());const damp=damp0||0.9965;
 const lp=1-bright*0.5;for(let i=N+1;i<len;i++)y[i]=damp*((1-lp)*y[i-N]+lp*0.5*(y[i-N]+y[i-N-1])); /* brighter = less smoothing per pass */
 const s=AC.createBufferSource(),q=AC.createGain(),n=AC.currentTime;s.buffer=buf;q.gain.setValueAtTime(v,n);q.gain.setValueAtTime(v,n+dur*.55);q.gain.exponentialRampToValueAtTime(.001,n+dur); /* let the string ring on its own, fade only at the end */s.connect(q);q.connect(OUTN||master);s.start(n);}
// a tone that swells in (no hard attack) and rings out slowly
function swell(f,v,d,type){if(!AC||muted)return;const n=AC.currentTime,o=AC.createOscillator(),q=AC.createGain();o.type=type||'sine';o.frequency.value=f;q.gain.setValueAtTime(.0001,n);q.gain.exponentialRampToValueAtTime(v,n+.12);q.gain.exponentialRampToValueAtTime(.0005,n+d);o.connect(q);q.connect(OUTN||master);o.start(n);o.stop(n+d+.05);}
let OUTN=null,REV=null;
function withRev(fn){if(!AC)return;if(!REV){const len=AC.sampleRate*6,ir=AC.createBuffer(2,len,AC.sampleRate);for(let c=0;c<2;c++){const a=ir.getChannelData(c);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}
 const cv=AC.createConvolver();cv.buffer=ir;const wet=AC.createGain();wet.gain.value=0.55;REV=AC.createGain();REV.connect(master);REV.connect(cv);cv.connect(wet);wet.connect(master);}
 OUTN=REV;try{fn();}finally{OUTN=null;}}
// low brass swell: two detuned saws through a lowpass that opens and closes
function braam(f,v,d){if(!AC||muted)return;const n=AC.currentTime,lp=AC.createBiquadFilter(),q=AC.createGain();lp.type='lowpass';lp.frequency.setValueAtTime(200,n);lp.frequency.linearRampToValueAtTime(900,n+.25);lp.frequency.exponentialRampToValueAtTime(150,n+d);
 q.gain.setValueAtTime(.0001,n);q.gain.exponentialRampToValueAtTime(v,n+.18);q.gain.exponentialRampToValueAtTime(.0001,n+d);lp.connect(q);q.connect(OUTN||master);
 for(const det of [-6,7]){const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=det;o.connect(lp);o.start(n);o.stop(n+d+.05);}}
const thr={};const once=(k,ms,fn)=>{const n=performance.now();if(n-(thr[k]||0)<ms)return;thr[k]=n;fn();};
const SFX={
 bow:()=>once('bow',60,()=>{noise(.16,.18,2600,2,0,-1800);tone(420,.05,'triangle',.06,-200);}),   // twang + whoosh of the arrow
 /* lord arrow */
 twang:()=>once('twang',70,()=>whoosh(.32,.22,1500,700)), /* lord: a soft 'whoosh' that swells in and fades out - no hard attack click */
 /* tower and wall archers: the old arrow sound, much quieter and throttled since many shoot at once */
 arch:()=>once('arch',110,()=>{tone(340+Math.random()*40,.16,'sine',.06,-110);tone(700,.07,'sine',.018,-260);}), /* archers: a soft rubber-band 'ting', no noise click */
 hit:()=>once('hit',45,()=>{noise(.05,.16,900,1.5);tone(180,.05,'square',.05,-60);}),
 kill:()=>once('kill',50,()=>{noise(.09,.18,500,1);tone(260,.08,'triangle',.08,-160);}),
 castle:()=>once('castle',120,()=>{noise(.18,.28,180,0.8);tone(70,.18,'sine',.25,-20);}),
 sword:()=>once('sword',90,()=>{noise(.07,.12,4200,3,0,-2000);}),
 boom:()=>{noise(.7,.5,300,0.6,0,-220);tone(70,.6,'sawtooth',.35,-30);},
 // the ultimate's 'ding': a bright metallic ring with long decay, over a deep thump and a rushing whoosh
 /* catapult launch: wooden arm thunk, then an air whoosh that follows the stone; fire pots add a roaring, crackling blaze */
 fling:(dur,fire)=>{tone(80,.25,'triangle',.9,-35);tone(120,.12,'triangle',.45,-60);noise(.12,.75,320,1.1);noise(.18,.4,180,0.9,.02);
  }, /* boulder landing: hard stone crack plus scattering gravel; fire pots also burst into flame */
 rock:fire=>{tone(70,.38,'sine',.85,-30);tone(105,.24,'triangle',.55,-50);noise(.12,.8,700,1.1);noise(.25,.65,380,0.9,0,-150);
  for(let i=0;i<7;i++)noise(.05+Math.random()*.06,.17+Math.random()*.14,500+Math.random()*900,1.6,.04+Math.random()*.3);
  /* rumbling tail that echoes off: soft, low, fading repeats */
  [[.12,.3],[.26,.2],[.42,.13],[.6,.07]].forEach(([dl,v])=>{noise(.45,v,260,0.7,dl,-120);tone(62,.4,'sine',v*1.2,-15,dl);});
  if(fire){noise(.45,.55,450,0.7,0,-250);noise(.45,.3,320,0.6,.3,-100);noise(.45,.2,320,0.6,.6,-100);for(let i=0;i<8;i++)noise(.04,.12,900+Math.random()*900,1.8,.05+Math.random()*.5);}}, /* ultimate: a huge, dark cinematic hit - deep bell partials + a low brass 'braaam' swell, sent through a long (~6s) reverb tail */
 /* drawing the great bow: a taut low string plucked (beats 1-2-3 of the rhythm draw) */
 /* everything here is plucked strings only (guitar + contrabass), modelled with ksPluck, through the long reverb.
    Rhythm plucks, picked by ear from the reference clip: guitar A#3, D#4, D4 */
 pluck:i=>withRev(()=>{const f=[233.08,311.13,293.66][i]||311.13;ksPluck(f,.55,1.8,.9,.997);ksPluck(f*1.002,.18,1.4,.5,.996);noise(.02,.06,3200,1.5);}),
 /* the release: no plucked strings - a grand swell of harmonics on G (G1-G2-D3-G3-B3-D4) with the C3 fourth, soft attack, long reverb */
 ding:(perfect)=>{withRev(()=>{
   tone(49,1.6,'sine',.5,-3);tone(98,1.1,'sine',.22,-5);tone(147,.5,'sine',.08,-6);noise(.12,.22,90,.7); /* a thick contrabass string pulled hard: deep G1 with a soft low thump, no bright string noise */
   [[49,.34,5.5],[98,.3,5.2],[146.8,.16,4.6],[196,.14,4.2],[246.9,.07,3.6],[293.7,.06,3.2],[392,.04,2.8],[130.81,.15,4.8]].forEach(([fq,v,d])=>{swell(fq,v*.55,d,'sine');swell(fq*1.004,v*.27,d*.9,'sine');});
   noise(.6,.08,220,.6,0,-120);});}, coin:()=>tone(1300,.07,'triangle',.12),
 pick:()=>{tone(700,.08,'square',.1,500);tone(1050,.08,'square',.06,0,.06);},
 horn:()=>{[0,.18,.36].forEach((t,i)=>tone([220,277,330][i],.32,'sawtooth',.09,0,t));},
 win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.16,'square',.1,0,i*.09)),
 over:()=>[392,330,262,196].forEach((f,i)=>tone(f,.3,'triangle',.18,0,i*.2))};
function startBGM(){if(bgmT)return;let step=0;const bass=[110,110,147,147,131,131,98,110],mel=[440,0,494,523,494,440,392,0,440,0,523,587,523,494,440,0];
 bgmT=setInterval(()=>{if(muted||!S||!S.started||S.over||S.paused)return;const b=bass[(step>>1)%8];if(step%2==0)tone(b,.22,'triangle',.11);
  const m=mel[step%16];if(m)tone(m,.14,'square',.028);if(step%4==0)noise(.05,.06,150,1);if(step%4==2)noise(.03,.04,3000,2);step++;},170);}
// ---------- data ----------
// balance knobs (tuned with a bot playing all 99 waves): grunt HP growth past wave 12, enemy damage growth,
// boss HP growth per boss tier, giant-boss HP multiplier, soldier-upgrade cost growth
// e: early-wave (1-9) HP factor; a/b: extra HP growth per wave past 20 / past 30; lg/lr: lord damage / attack-speed growth; cd: share of enemy damage the castle takes
const BAL={hp:0.04,dmg:0.06,bg:0.18,mega:1.8,su:0.08,run:0.3,lc:1,gold:0.034,ult:20,bd:0.35,e:0.85,a:0.018,b:0.025,lg:1.143,lr:0.17,cd:0.25};
const waveHpK=w=>(w<10?BAL.e:1)*(1+Math.max(0,w-20)*BAL.a+Math.max(0,w-30)*BAL.b);
const MAXW=50; // last wave
// lord damage grows faster than anything else (by Lv50 he out-damages any fully upgraded unit) but costs more
const lordDmgAt=l=>Math.round(10*(1+l*0.4)*Math.pow(BAL.lg,l));
const UNITS=[
 {key:'1',ic:'⚔️',name:'검사',cost:30,hp:60,dmg:8,range:24,spd:50,rate:.8,col:'#4f8fff',kind:'sword'},
 {key:'2',ic:'🗼',name:'타워',cost:90,hp:320,dmg:9,range:210,spd:0,rate:.85,col:'#8a8f9c',kind:'tower',ranged:1,fixed:1},
 {key:'3',ic:'🪨',name:'투석기',cost:400,hp:200,dmg:22,range:470,spd:0,rate:4.2,col:'#8a5a2e',kind:'catapult',ranged:1,fixed:1,cat:1},
 {key:'4',ic:'🪵',name:'바리케이드',cost:60,hp:500,dmg:4,range:0,spd:0,rate:1,col:'#7a5230',kind:'barr',fixed:1,barr:1}];
// barricade: sharpened-log wall that orcs must hack through; spikes hurt whoever hits it.
// One shared upgrade (up to 20); it only applies to barricades placed after the upgrade
const barrCost=u=>Math.round(40+(u.bl||0)*35+(u.bl||0)**2*6);
function barrApply(u){const k=1+0.8*(u.bl||0),r=u.hp/u.max;u.max=u.base.hp*k;u.hp=u.max*r;u.dmg=u.base.dmg*(1+0.5*(u.bl||0));}
// building level (0-3): towers hit harder and get tougher, castle and towers change look
// tower tiers: archers -> crossbowmen -> great crossbow (ballista) tower -> royal ballista tower
const bDm=()=>[1,1.6,2.6,4][S.lv.bld||0],bHm=()=>[1,1.6,2.4,3.5][S.lv.bld||0];
const towerDmg=u=>u.base.dmg*S.aAtk*bDm();
const UPS=[
 {key:'q',ic:'👑',sh:'영주공격',name:'영주 공격력',lv:'dmg',max:50,cost:l=>Math.round((60+l*30+l*l*4.5)*BAL.lc),apply:()=>S.lordDmg=lordDmgAt(S.lv.dmg)},
 {key:'w',ic:'⚡',sh:'영주공속',name:'영주 공속',lv:'rate',max:50,cost:l=>Math.round((80+l*40+l*l*2)*BAL.lc),apply:()=>S.lordRate=1/(1+BAL.lr*S.lv.rate)},
 {key:'e',ic:'🏰',sh:'성벽',name:'성벽 강화',lv:'wall',max:99,cost:l=>50+l*40,apply:()=>{S.castleMax+=100;S.castle=Math.min(S.castleMax,S.castle+150)}},
 {key:'r',ic:'🏹',sh:'성벽궁수',name:'성벽 궁수 (최대 4)',lv:'warch',max:4,cost:l=>[300,700,1500,3000][l],apply:()=>{}},
 {key:'u',ic:'🏛️',sh:'건물',name:'건물 업그레이드 (타워: 석궁병 → 대형석궁탑 → 왕실 석궁탑, 성벽)',lv:'bld',max:3,cost:l=>[2000,5000,12000][l],apply:()=>{S.units.forEach(u=>{if(u.kind=='tower'){u.dmg=towerDmg(u);u.max=u.base.hp*bHm();u.hp=u.max;}});S.castleMax+=300;S.castle=Math.min(S.castleMax,S.castle+300);S.fx.push({x:CX+200,y:TOP+60,t:1.8,txt:'🏛️ 건물 Lv'+S.lv.bld,col:'#ffd27a'});SFX.horn();}},
 {key:'o',ic:'🪵',sh:'목책강화',name:'바리케이드 강화 (새로 설치하는 것부터 적용)',lv:'barr',max:20,cost:l=>barrCost({bl:l}),apply:()=>{}},
 {key:'i',ic:'🎯',sh:'궁수공격',name:'궁수 공격력 (타워·성벽 궁수)',lv:'aatk',max:50,cost:l=>Math.round((80+l*60)*(1+l*BAL.su)),apply:()=>{S.aAtk+=.25;S.units.forEach(u=>{if(u.kind=='tower')u.dmg=towerDmg(u);});}},
 {key:'t',ic:'🗡️',sh:'병사공격',name:'병사 공격력',lv:'uatk',max:99,cost:l=>Math.round((70+l*55)*(1+l*BAL.su)),apply:()=>{S.uAtk+=.3;S.units.forEach(u=>{if(u.kind=='sword')u.dmg=u.base.dmg*S.uAtk;});promo();}},
 {key:'y',ic:'❤️',sh:'병사체력',name:'병사 체력',lv:'uhp',max:99,cost:l=>Math.round((70+l*55)*(1+l*BAL.su)),apply:()=>{S.uHp+=.6;S.units.forEach(u=>{if(u.kind=='sword'){const r=u.hp/u.max;u.max=u.base.hp*S.uHp*swMul();u.hp=u.max*r;}});promo();}}];
function reset(go){lastSWT=0;S={started:!!go,gold:90,wave:1,castle:300,castleMax:300,lordDmg:10,lordRate:1,lordT:0,arrows:1,tArch:1,uAtk:1,uHp:1,aAtk:1,income:2,incT:0,
 units:[],enemies:[],shots:[],fx:[],boulders:[],pools:[],items:[],bombs:3,spawnLeft:0,spawnT:0,waveT:1,over:false,paused:false,kills:0,shake:0,t:0,
 lv:{dmg:0,rate:0,wall:0,warch:0,bld:0,barr:0,aatk:0,uatk:0,uhp:0},lordAim:0,waveBonus:0};S.spawnLeft=8+S.wave*4;S.eliteAt=Math.ceil(S.spawnLeft/2);}

  g.save();g.lineCap='round';for(let i=0;i<3;i++){if(Math.random()<.35)continue;const a=Math.random()*6.28;let px=ex+Math.cos(a)*e.r*.3,py=ey-e.r*.4+Math.sin(a)*e.r*.3;g.beginPath();g.moveTo(px,py);for(let s=0;s<4;s++){px+=Math.cos(a)*e.r*.3+(Math.random()-.5)*e.r*.6;py+=Math.sin(a)*e.r*.3+(Math.random()-.5)*e.r*.6;g.lineTo(px,py);}g.strokeStyle='#bfe6ff';g.lineWidth=3;g.globalAlpha=.5;g.stroke();g.strokeStyle='#ffffff';g.lineWidth=1.2;g.globalAlpha=.95;g.stroke();}g.restore();}

   const rg=g.createRadialGradient(0,0,4,0,0,W*2.2);rg.addColorStop(0,'rgba(255,255,255,.9)');rg.addColorStop(.4,'rgba(255,214,90,.5)');rg.addColorStop(1,'rgba(255,170,40,0)');g.fillStyle=rg;g.beginPath();g.arc(0,0,W*2.2,0,7);g.fill();

// ultimate visuals: a charging glow at the lord during the wind-up; on release a long jagged lightning lane along the
// whole flight path that flickers and fades, plus ghost after-images of the arrow along its trail
// charging the great bow while the beat dial turns: sparks stream into the lord, a core of light swells and
// crackling arcs grow toward the 'ding' moment (each 4-beat cycle builds up again)
function drawCharge(t){const k=Math.min(1,(t-drag.t0)/DRAW_FULL),[lx,ly]=P(...lordPos());g.save();g.lineCap='round';
 for(let i=0;i<10+k*22;i++){const a=i*2.399+t*1.7,ph=((t*1.6+i*.137)%1),r=90*(1-ph)+8;g.globalAlpha=(.25+.6*k)*ph;g.strokeStyle=i%3?'#ffe27a':'#9fe8ff';g.lineWidth=1.5+k;
  g.beginPath();g.moveTo(lx+Math.cos(a)*r,ly+Math.sin(a)*r);g.lineTo(lx+Math.cos(a)*(r+10+k*10),ly+Math.sin(a)*(r+10+k*10));g.stroke();}
 g.globalAlpha=.2+.35*k;g.fillStyle='#ffe27a';g.beginPath();g.arc(lx,ly,14+k*26+Math.sin(t*20)*2,0,7);g.fill();
 g.globalAlpha=.6+.4*k;g.fillStyle='#fffbe0';g.beginPath();g.arc(lx,ly,4+k*9,0,7);g.fill();
 g.strokeStyle='#bff4ff';g.lineWidth=1.6;for(let j=0;j<Math.floor(1+k*5);j++){let a=Math.random()*6.28,r=12;g.globalAlpha=.5+.5*k;g.beginPath();g.moveTo(lx+Math.cos(a)*r,ly+Math.sin(a)*r);for(let q=0;q<5;q++){a+=(Math.random()-.5)*.9;r+=6+k*6;g.lineTo(lx+Math.cos(a)*r,ly+Math.sin(a)*r);}g.stroke();}
 g.restore();}
// ultimate as an energy beam (Kamehameha-style but slimmer): an energy ball gathers at the bow during the 0.5s wait with a thin
// guide line; on release a blue-white beam with a wobbling glow edge and a bright core blasts down the lane, holds, then narrows away
function beamBand(x0,y0,dx,dy,len,r,col,al,t,wob){const nx=-dy,ny=dx,n=Math.max(2,Math.ceil(len/24));g.globalAlpha=al;g.fillStyle=col;g.beginPath();
 for(let i=0;i<=n;i++){const u=i/n,w=r*(1+wob*Math.sin(u*len*.018-t*40)+wob*.5*Math.sin(u*len*.041+t*29)),x=x0+dx*len*u,y=y0+dy*len*u;i?g.lineTo(x+nx*w,y+ny*w):g.moveTo(x+nx*w,y+ny*w);}
 for(let i=n;i>=0;i--){const u=i/n,w=r*(1+wob*Math.sin(u*len*.018-t*40+1.7)+wob*.5*Math.sin(u*len*.041+t*29+.9)),x=x0+dx*len*u,y=y0+dy*len*u;g.lineTo(x-nx*w,y-ny*w);}g.closePath();g.fill();
 g.beginPath();g.arc(x0+dx*len,y0+dy*len,r*1.05,0,7);g.fill();}
function drawUltBolt(s,W,T){g.save();const far=Math.max(CW,CH)*1.6,fl=s.flash||0,R=W*.62,t=performance.now()/1000;
 if(s.delay>0){const k=Math.min(1,fl/.5),pul=1+Math.sin(t*45)*.12;
  g.globalAlpha=.5*k;g.strokeStyle='#bfe6ff';g.lineWidth=1.5;g.beginPath();g.moveTo(s.ox,s.oy);g.lineTo(s.ox+s.dx*far,s.oy+s.dy*far);g.stroke();
  for(const [rr,col,al] of [[2.2,'#4fb0ff',.35],[1.5,'#a8e4ff',.6],[.8,'#ffffff',1]]){g.globalAlpha=al*(.4+.6*k);g.fillStyle=col;g.beginPath();g.arc(s.ox,s.oy,R*rr*(.4+.6*k)*pul,0,7);g.fill();}
  g.restore();return;}
 const age=s.age||0,HOLD=.45,FADE=.3;if(age>HOLD+FADE){g.restore();return;}
 const len=Math.min(far,age*20000),shrink=age<HOLD?1:1-(age-HOLD)/FADE,r=R*shrink*(age<.05?.6+age*8:1);
 beamBand(s.ox,s.oy,s.dx,s.dy,len,r*1.9,'#3f8fff',.38,t,.07);
 beamBand(s.ox,s.oy,s.dx,s.dy,len,r*1.25,'#8fd6ff',.7,t,.045);
 beamBand(s.ox,s.oy,s.dx,s.dy,len,r*.6,'#ffffff',.95,t,.02);
 for(const [rr,col,al] of [[2.3,'#4fb0ff',.4],[1.6,'#a8e4ff',.7],[.95,'#ffffff',1]]){g.globalAlpha=al*shrink;g.fillStyle=col;g.beginPath();g.arc(s.ox,s.oy,R*rr*(1+Math.sin(t*50)*.1),0,7);g.fill();}
 g.globalAlpha=shrink;g.fillStyle='#e8f8ff';for(let i=0;i<6;i++){const u=Math.random(),x=s.ox+s.dx*len*u+(-s.dy)*(Math.random()-.5)*r*4,y=s.oy+s.dy*len*u+s.dx*(Math.random()-.5)*r*4;g.fillRect(x,y,2.5,2.5);}
 g.restore();}function drawBombUI(){const b=bombBtn(),n=S.bombs,t=performance.now()/1000;drawTick();if(drag&&!drag.cancel&&!drag.out)drawCharge(t);
 g.save();g.globalAlpha=n?1:.45;
 g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fillStyle='#1a1208dd';g.fill();g.lineWidth=3;g.strokeStyle=drag?'#fff6c0':'#ffd27a';g.stroke();
 if(n&&!drag){g.globalAlpha=.25+Math.sin(t*4)*.15;g.beginPath();g.arc(b.x,b.y,b.r+5,0,7);g.strokeStyle='#ffe27a';g.lineWidth=3;g.stroke();g.globalAlpha=n?1:.45;}
 g.save();g.translate(b.x,b.y);g.rotate(-Math.PI/4);g.fillStyle='#fff6d0';g.fillRect(-14,-2,22,4);g.fillStyle='#ffd040';g.beginPath();g.moveTo(15,0);g.lineTo(6,-7);g.lineTo(6,7);g.fill();g.fillStyle='#ff9a20';g.fillRect(-17,-5,5,10);g.restore();
 g.globalAlpha=1;g.beginPath();g.arc(b.x+b.r*.72,b.y+b.r*.72,13,0,7);g.fillStyle=n?'#e0a02f':'#555';g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();
 g.fillStyle='#fff';g.font='bold 15px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(n,b.x+b.r*.72,b.y+b.r*.72+1);if(n>=BOMB_MAX){g.font='bold 9px sans-serif';g.fillStyle='#ffd27a';g.fillText('MAX',b.x+b.r*.72,b.y+b.r*.72+20);}g.textBaseline='alphabetic';
 g.font='bold 11px "Malgun Gothic"';g.fillStyle='#fbeed3';g.fillText(drag?'여기로 놓으면 취소':'필살 화살 · 드래그로 조준',b.x-(PORT?40:0),b.y-b.r-8);
 g.restore();
 if(!drag||drag.out)return;
 // aim preview: a wide golden lane from the lord through the finger, to the edge of the screen
 const [lx,ly]=P(...lordPos());let dx=drag.x-lx,dy=drag.y-ly;const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;const W=SBW(),far=Math.max(CW,CH)*1.5;
 g.save();if(drag.cancel){g.globalAlpha=.4;}
 g.translate(lx,ly);g.rotate(Math.atan2(dy,dx));g.fillStyle='rgba(255,226,122,.18)';g.fillRect(0,-W,far,W*2);
 g.setLineDash([12,8]);g.lineDashOffset=-t*60;g.strokeStyle=drag.cancel?'#ffffffaa':'#ffe27a';g.lineWidth=2;g.beginPath();g.moveTo(0,-W);g.lineTo(far,-W);g.moveTo(0,W);g.lineTo(far,W);g.stroke();g.setLineDash([]);
 g.restore();
 if(!drag.cancel)for(const e of S.enemies){const [ex,ey]=P(e.x,e.y),rx=ex-lx,ry=ey-ly;if(rx*dx+ry*dy>0&&Math.abs(rx*dy-ry*dx)<W+e.r){g.beginPath();g.arc(ex,ey,e.r+5,0,7);g.strokeStyle='#ffd040';g.lineWidth=2.5;g.stroke();}}}
addEventListener('keydown',e=>{au();const k=e.key.toLowerCase();const u=UNITS.find(u=>u.key==k);if(u)summon(u);const p=UPS.find(p=>p.key==k);if(p)upgrade(p);if(k=='p')S.paused=!S.paused;});
let last=performance.now(),frameN=0;
// capped at ~60fps so 120Hz screens don't render twice as often
let FPS=30,RS=1,FDT=1/30; // graphics options from the arcade menu: 60/30 fps, canvas resolution scale
function loop(n){if(n-last<(FPS==30?30:15)){requestAnimationFrame(loop);return;}const dt=Math.min(.05,(n-last)/1000);last=n;FDT=dt;update(dt);draw();if((frameN=(frameN+1)%4)==0)btns.forEach(f=>f()); /* button labels only need refreshing a few times a second */requestAnimationFrame(loop);}
function fit(){const st=document.getElementById("stage"),cs=getComputedStyle(st),pad=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0),vh=(window.visualViewport?visualViewport.height:innerHeight),aw=st.clientWidth-4,ah=Math.min(st.clientHeight,vh-document.getElementById("ui").offsetHeight-(st.offsetTop||0))-pad-4, /* leave out the stage padding so the canvas never runs into the buttons */k=Math.min(aw/CW,ah/CH);cv.style.width=CW*k+"px";cv.style.height=CH*k+"px";}
// commands from the arcade gear menu
let menuPaused=false;addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="arcade-cmd")return;
 if(d.cmd=="gfx"){FPS=d.fps==30?30:60;const r={high:2,mid:1,low:.7}[d.res]||1;if(r!==RS){RS=r;cv.width=CW*RS;cv.height=CH*RS;}}
 if(d.cmd=="mute")muted=!!d.on;
 if(d.cmd=="pause"&&!S.paused&&!S.over){S.paused=true;menuPaused=true;}
 if(d.cmd=="resume"&&menuPaused){menuPaused=false;S.paused=false;}});
reset();setMode();btns.forEach(f=>f());fit();if(window.ResizeObserver)new ResizeObserver(()=>fit()).observe(document.getElementById("ui")); /* re-fit whenever the button bar changes size */addEventListener("resize",()=>{setMode();fit();});if(window.visualViewport)visualViewport.addEventListener("resize",fit);setTimeout(fit,300);requestAnimationFrame(loop);

<script>/* iOS suspends audio when the screen locks: resume it when we come back and on the next touch */(function(){const wake=()=>{try{if(typeof AC!=='undefined'&&AC&&AC.state!=='running')AC.resume();}catch(e){}};document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake();});['pointerdown','touchend','keydown'].forEach(ev=>addEventListener(ev,wake,true));addEventListener('message',e=>{if(e.data&&e.data.type==='arcade-cmd'&&e.data.cmd==='resume')wake();});})();</script>
